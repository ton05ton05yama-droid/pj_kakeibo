function memoInput(sh) {
  return `<div class="memo-in"><label class="sr" for="rec-memo">メモ</label><input class="inp" id="rec-memo" maxlength="30" value="${esc(sh.memo)}" data-in="memo" data-blur="memoDone" enterkeyhint="done" placeholder="メモ（30字まで）" autocomplete="off"></div>`;
}
/* その場の1行（§1.4）: エラーは --text-danger、それ以外は --text-sub。置き場所は高さを増やさない所（§4.0.3）:
   S-12・S-14・S-15 は金額の行の左（amtNote）、S-21 は見出しの行の右、S-32・S-33・S-34・S-01・S-02 は欄の下（field を指定）。
   欄に結びつかない1行（field: null。オンラインで直せます）は固定部分の直上 */
function errLine(o, field) {
  if (!o || !o.err) return '';
  if (field !== undefined && (o.err.field || null) !== field) return '';
  return `<p class="${o.err.kind === 'err' ? 'err' : 'inl'}" role="alert" data-errline style="margin-top:4px">${esc(o.err.t)}</p>`;
}
/* 金額の行の左: その場の1行が出ているあいだは、条件つきの注記（note）の代わりに出す */
function amtNote(sh, note) {
  if (sh.err) return `<p class="amt-msg ${sh.err.kind === 'err' ? 'err' : 'inl'}" role="alert">${esc(sh.err.t)}</p>`;
  return note || '';
}
function catGrid(act, selected) {
  return `<div class="grid" data-g="grid">` + CATEGORIES.map((c) =>
    `<button type="button" class="cell ${c.key === selected ? 'on' : ''}" data-act="${act}" data-arg="${c.key}" ${c.key === selected ? 'aria-current="true"' : ''}>${ic(c.icon, 24)}<span>${c.name}</span>${c.key === selected ? ic('check', 16, 'chk') : ''}</button>`).join('') + `</div>`;
}
/* 上部バー・月切替（§3.4）。年月を押すと S-04「月を選ぶ」が開く（‹ › の矢印はそのまま）。
   既定の月以外は年月を青くする（いま既定以外を見ているという合図。押すと既定の月に戻る動きは S-04 に置き換えた）。今月より先には進めない */
function monthBar(tabKey, m) {
  const def = tabKey === 'S10' ? curMonth() : CALC.defaultSettleMonth(S.data, S.now);
  const prevOk = m > S.data.household.createdMonth, nextOk = m < curMonth();
  const off = m !== def;
  const title = `<h1 class="appbar-h"><button type="button" class="appbar-title ${off ? 'off' : ''}" data-act="openS04" data-arg="${tabKey}" aria-label="${mLabel(m)}（月を選ぶ）">${mLabel(m)}${ic('chevron-down', 16)}</button></h1>`;
  return `<header class="appbar" data-g="month">
    ${prevOk ? `<button type="button" class="iconbtn" data-act="monthStep" data-arg="${tabKey}:-1" aria-label="前の月">${ic('chevron-left', 24)}</button>` : '<span></span>'}
    ${title}
    ${nextOk ? `<button type="button" class="iconbtn" data-act="monthStep" data-arg="${tabKey}:1" aria-label="次の月">${ic('chevron-right', 24)}</button>` : '<span></span>'}
  </header>`;
}
/* §3.6 オフラインの行 */
const offlineLine = () => (S.offline ? `<div class="offline">${ic('cloud-off', 16)}オフライン（表示は最後に取得した内容）</div>` : '');

/* ---------------------------------------------------------------------
   8. 画面ごとの render（HTML 文字列を返す。ルート要素に data-screen / data-state）
   --------------------------------------------------------------------- */
/* 「高い」シート（§4.0.3）: calc(100dvh − max(24px, 上の safe-area ＋ 8px)) まで使ってよい（375×548 で 524px） */
const TALL = new Set(['S-12', 'S-14', 'S-15', 'S-21', 'S-32']);
const SHEETS = {};
/* シートの読み上げ名（画面IDは使わない。§4.0.3） */
function sheetLabel(sh) {
  switch (sh.id) {
    case 'S-03': return 'ホーム画面に追加';
    case 'S-04': return '月を選ぶ';
    case 'S-12': return `いくら？（${catOf(sh.cat).name}）`;
    case 'S-13': return `${mShort(sh.m)}の内訳`;
    case 'S-14': {
      const e = MODEL.find(S.data, sh.rowId); if (!e) return '記録';
      return `記録（${catOf(e.cat).name} ${e.skipped ? '今月はなし' : e.amount == null ? '金額待ち' : fmt(e.amount) + '円'}）`;
    }
    case 'S-15': { const e = MODEL.find(S.data, sh.queue[sh.idx]); return e ? `金額を入れる（${tplLabel(e)}）` : '金額を入れる'; }
    case 'S-21': return `${mShort(sh.m)}の出す額`;
    case 'S-22': return `${whoName(sh.p)}の内訳`;
    case 'S-32': return sh.tplId ? `毎月の支払いを直す（${sh.origName}）` : '毎月の支払いを追加';
    case 'S-33': return `人の設定（${whoName(sh.p)}）`;
    case 'S-34': return 'パスワードを変える';
    default: return '';
  }
}

/* S-01 ログイン（§4 S-01）。状態 empty / normal / action / done */
function renderS01() {
  const L = S.login;
  const idErr = L.err === 'id' ? 'IDを入れてください' : '';
  const pwErr = L.err === 'pw' ? 'パスワードを入れてください' : '';
  const fail = L.err === 'fail';
  const st = L.state === 'done' ? 'done' : fail ? 'action' : L.err ? 'empty' : 'normal';
  return `<div class="screen s01" data-screen="S-01" data-state="${st}">
  <form data-submit="login" novalidate>
    <h1 class="appname">${esc(S.data.household.appName)}</h1>
    <div class="field" data-g="id"><label for="login-id">ID</label>
      <input class="inp ${idErr || fail ? 'bad' : ''}" id="login-id" name="username" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username" value="${esc(L.id)}" data-in="loginId"${idErr ? ' aria-invalid="true" aria-describedby="login-id-err"' : ''}>
      ${idErr ? `<p class="err" id="login-id-err" data-errline>${idErr}</p>` : ''}</div>
    <div class="field" data-g="pw"><label for="login-pw">パスワード</label>
      <div class="pw"><input class="inp ${pwErr || fail ? 'bad' : ''}" id="login-pw" name="password" type="${L.show ? 'text' : 'password'}" autocomplete="current-password" value="${esc(L.pw)}" data-in="loginPw"${pwErr ? ' aria-invalid="true" aria-describedby="login-pw-err"' : ''}>
      <button type="button" class="iconbtn" data-act="loginEye" aria-label="${L.show ? 'パスワードを隠す' : 'パスワードを表示'}" aria-pressed="${L.show}">${ic(L.show ? 'eye-off' : 'eye')}</button></div>
      ${pwErr ? `<p class="err" id="login-pw-err" data-errline>${pwErr}</p>` : ''}
      ${fail ? `<p class="err" role="alert" data-errline>IDかパスワードがちがいます</p>` : ''}</div>
    <div style="margin-top:20px"><button type="submit" class="btn-fill" data-g="login"${L.state === 'done' ? ' aria-busy="true"' : ''}>${L.state === 'done' ? '<span class="spinner" aria-hidden="true"></span><span class="sr">ログイン</span>' : 'ログイン'}</button></div>
    ${fail ? `<p class="note" style="margin-top:12px;text-align:center" data-errline>忘れたときは まさとが再設定します</p>` : ''}
  </form></div>`;
}

/* S-02 はじめに（§4 S-02）。状態 normal / action */
function renderS02() {
  const O = S.onboard, p = S.viewer;
  return `<div class="screen s02" data-screen="S-02" data-state="${O.err ? 'action' : 'normal'}">
  <form data-submit="start" novalidate>
    <div style="display:flex;justify-content:center"><span class="av av56 av-${S.data.people[p].color}" id="s02-av" aria-hidden="true">${esc([...O.name][0] || '')}</span></div>
    <h1 class="sh-title" style="text-align:center;margin-top:16px"><label for="onb-name">あなたの呼び名</label></h1>
    <div class="field" data-g="name"><input class="inp ${O.err ? 'bad' : ''}" id="onb-name" value="${esc(O.name)}" data-in="onbName" autocomplete="nickname"${O.err ? ' aria-invalid="true" aria-describedby="onb-err"' : ''}>
      ${O.err ? `<p class="err" id="onb-err" data-errline>${esc(O.err)}</p>` : ''}</div>
    <p class="msg" style="margin-top:16px">ふたりの家計で払ったものだけを記録します</p>
    <p class="note" style="margin-top:4px">共用 ＝ ふたりの共用口座・共用カード</p>
    <div style="margin-top:24px"><button type="submit" class="btn-fill" data-g="start">はじめる</button></div>
    ${S.safari ? `<div style="text-align:center;margin-top:8px"><button type="button" class="btn-text" data-act="openS03" data-g="a2hs">ホーム画面に追加</button></div>` : ''}
  </form></div>`;
}

/* S-03 ホーム画面に追加（§4 S-03）。S-02・S-30 から開くシート。見出しは置かない（読み上げ名はシートの aria-label「ホーム画面に追加」）。
   手順のアイコンは --text-sub（押せないので青にしない） */
SHEETS['S-03'] = () => `<div class="sh-root" data-screen="S-03" data-state="normal">
  <ol class="s03-steps">
    <li><span class="n">1</span><span>共有 ${ic('share')} を押す</span></li>
    <li><span class="n">2</span><span>「ホーム画面に追加」${ic('square-plus')}</span></li>
    <li><span class="n">3</span><span>「追加」</span></li>
  </ol>
  <p class="note">ホーム画面から開くと、もう一度ログインが要ることがあります</p>
  <div class="sh-foot" style="margin-top:16px"><button type="button" class="btn-fill" data-act="closeSheet" data-g="ok">わかった</button></div>
</div>`;

/* S-04 月を選ぶ（§4 S-04・§3.4）。支出タブと精算タブの上部バーの年月から開く同じ部品（§2.3 E6。移る先のタブだけが違う）。状態 normal だけ。
   年の切替はシートの中の状態（開いたときは見ている月の年）。マスを押すと、そのタブの月を変えてシートを閉じる。
   金額・精算の状態はマスに出さない（選ぶ前に読む量を増やさない。§11）。
   家計を作る前の月・今月より先の月はボタンにしない（P7）。今月（JST）にだけ「今月」を添える（精算タブの既定の月は今月とは限らないため、目印は「今月」だけ） */
SHEETS['S-04'] = (sh) => {
  const cur = S.month[sh.tab];                                   /* いま見ている月 */
  const first = S.data.household.createdMonth, last = curMonth();
  const y = sh.year;
  const prevOk = y - 1 >= +first.slice(0, 4), nextOk = y + 1 <= +last.slice(0, 4);
  const cells = [];
  for (let i = 1; i <= 12; i++) {
    const m = `${y}-${String(i).padStart(2, '0')}`;
    if (m < first || m > last) { cells.push(`<span class="mcell off">${i}月</span>`); continue; }
    const on = m === cur;
    /* 読み上げ名は「2026年8月」。今月のマスだけ「2026年9月 今月」（§4.0.3 の表・S-04） */
    cells.push(`<button type="button" class="mcell ${on ? 'on' : ''}" data-act="pickMonth" data-arg="${m}" aria-label="${mLabel(m)}${m === last ? ' 今月' : ''}"${on ? ' aria-current="true"' : ''}>${i}月${m === last ? '<small>今月</small>' : ''}</button>`);
  }
  return `<div class="sh-root" data-screen="S-04" data-state="normal">
  <div class="yearbar"${prevOk || nextOk ? ' data-g="year"' : ''}>
    ${prevOk ? `<button type="button" class="iconbtn" data-act="s04Year" data-arg="-1" aria-label="前の年">${ic('chevron-left', 20)}</button>` : '<span></span>'}
    <span class="y">${y}</span>
    ${nextOk ? `<button type="button" class="iconbtn" data-act="s04Year" data-arg="1" aria-label="次の年">${ic('chevron-right', 20)}</button>` : '<span></span>'}
  </div>
  <div class="mgrid" data-g="months">${cells.join('')}</div>
</div>`;
};

/* ===== 支出タブ（S-10〜S-15） ===== */

/* S-10 の行（§7.5 一覧の行）。新着 = 前回この画面を見たあとに相手が記録した行。
   初めて S-10 を見るとき（lastSeen が null）は新着を出さない（§1.1） */
function listRow(e) {
  const c = catOf(e.cat), v = S.viewer, seen = S.data.people[v].lastSeen;
  const isNew = !e.tpl && e.by !== 'auto' && e.by !== v && seen != null && e.at > seen;
  const memo = rowName(e);
  const badges = (isNew ? badge('新着') : '') + (e.sync === 'pending' ? badge('未送信') : '') + (e.sync === 'failed' ? badge('送れませんでした') : '');
  return `<button type="button" class="lrow ${e.skipped ? 'muted' : ''} ${S.highlight === e.id ? 'hl' : ''}" data-act="openRow" data-arg="${e.id}" id="row-${e.id}">
    ${avatar(e.payer, 28)}
    <span class="lrow-main"><span class="lrow-cat">${c.name}</span>${memo ? `<span class="lrow-memo">${esc(memo)}</span>` : ''}${badges}</span>
    <span class="lrow-amt num">${e.skipped ? '今月はなし' : fmt(e.amount)}</span></button>`;
}
/* 金額待ちの行（破線）。右に「金額を入れる」→ S-15 */
function pendingRow(e) {
  return `<button type="button" class="prow" data-act="openPending" data-arg="${e.id}" id="row-${e.id}">
    ${ic(catOf(e.cat).icon)}<span class="prow-name">${esc(tplLabel(e))}</span>${avatar(e.payer, 20)}<span class="prow-go">金額を入れる</span></button>`;
}
/* §3.5 お知らせ行（道案内だけ。押すと精算タブのその月） */
function noticeRow(att) {
  const M = mShort(att.m);
  const t = att.kind === 1 ? `${M}の精算ができます`
    : att.amount > 0 ? `${M}: 共用へ ${fmt(att.amount)}円 入れる` : `${M}: 共用から ${fmt(att.amount)}円 受け取る`;
  return `<button type="button" class="notice" data-act="goSettle" data-arg="${att.m}" data-g="notice">${ic('arrow-left-right')}<span>${t}</span>${ic('chevron-right')}</button>`;
}
const byNewest = (x, y) => (y.date.localeCompare(x.date) || y.at.localeCompare(x.at) || y.seq - x.seq);
/* ひな形の並び（S-31 に作った順） */
const tplIdx = (e) => { const i = S.data.templates.findIndex((t) => t.id === e.tpl); return i < 0 ? 999 : i; };
/* 金額待ちの並び（S-10 要素7）: 対象月の古い順、同じならひな形の順 */
const byTpl = (x, y) => x.labelMonth.localeCompare(y.labelMonth) || (tplIdx(x) - tplIdx(y));
/* S-10 の金額待ちの行に出す行（S-10 要素7）: 今月を見ていて、前の月が締め待ちで金額待ちが残っているあいだは、前の月の金額待ち
   （今月の分は、前の月の金額待ちが片付くと出る）。それ以外は見ている月の金額待ち。S-12 の注記の条件にも使う */
function pendingShown(m) {
  const pm = CALC.addMonth(m, -1);
  if (m === curMonth() && pm >= S.data.household.createdMonth && statusOf(pm) === 'closing') {
    const pp = CALC.summarize(S.data.expenses, pm).pending;
    if (pp.length) return pp.slice().sort(byTpl);
  }
  return CALC.summarize(S.data.expenses, m).pending.slice().sort(byTpl);
}
/* S-10 の毎月の支払いの行: その月の分（ひな形の順）→ 前の月から回した分（対象月の古い順、同じならひな形の順） */
const byFixed = (m) => (x, y) => ((x.labelMonth !== m) - (y.labelMonth !== m)) || x.labelMonth.localeCompare(y.labelMonth) || (tplIdx(x) - tplIdx(y));

/* S-10 支出（§4 S-10・§3.4 月切替・§3.5 お知らせ行・§3.6 オフライン）。状態 empty / normal / action / locked */
function renderS10() {
  const d = S.data, v = S.viewer, m = S.month.S10;
  const sum = CALC.summarize(d.expenses, m);
  const locked = isLocked(m);
  const att = CALC.attention(d, v, S.now);
  const empty = sum.rows.length === 0 && sum.deferredOut.length === 0;
  /* normal は仕様書の図（9/22。金額待ちの行を含む）。action は お知らせ行があるか、締め待ちで金額待ちが残っているとき */
  const state = empty ? 'empty' : locked ? 'locked' : (att || (sum.pending.length && statusOf(m) === 'closing')) ? 'action' : 'normal';
  let h = `<div class="screen" data-screen="S-10" data-state="${state}">` + monthBar('S10', m) + offlineLine();
  if (att) h += noticeRow(att);
  h += `<p class="cap" style="margin-top:4px">${mShort(m)}のふたりの支出</p>`;
  h += `<p class="total" data-big>${yen(sum.total)}</p>`;
  if (locked) h += `<p style="margin-top:4px">${lockBadge(m)}</p>`;
  const notes = [];
  if (sum.pending.length) notes.push(`＋ 金額待ち ${sum.pending.length}件`);
  if (sum.unsent.length) notes.push(`未送信 ${sum.unsent.length}件`);
  if (notes.length) h += `<p class="note-sm">${notes.join('・')}</p>`;
  if (sum.count) h += `<div><button type="button" class="linkrow" data-act="openS13" data-g="breakdown">多いのは ${sum.byCat.slice(0, 3).map((x) => catOf(x.cat).name).join('・')} ${ic('chevron-right', 16)}</button></div>`;
  if (empty) h += `<p class="msg" style="margin-top:32px;text-align:center">記録タブから、ふたりの家計で払ったものを記録します</p>`;
  /* 金額待ちの行（見出しは置かない。合計の下の注記「＋ 金額待ち n件」が見出しを兼ねる。注記の件数は見ている月の数のまま）。
     今月を見ていて前の月が締め待ちで金額待ちが残っているあいだは、前の月の行を出す（pendingShown） */
  const shownPending = pendingShown(m);
  if (shownPending.length) {
    h += `<div data-g="pending" style="margin-top:16px">${shownPending.map(pendingRow).join('')}</div>`;
  }
  const manual = sum.manual.slice().sort(byNewest);
  if (manual.length) {
    h += `<div data-g="list">`;
    let cur = '';
    for (const e of manual) {
      if (e.date !== cur) { if (cur) h += `</div>`; cur = e.date; h += `<div class="dhead">${dateLong(e.date)}</div><div>`; }
      h += listRow(e);
    }
    h += `</div></div>`;
  }
  if (sum.fixedRows.length || sum.deferredOut.length) {
    /* 1行「[暦] 毎月の支払い　101,930 ▾」（件数は出さない）。金額は、金額が入っていて今月はなしでない行の合計 */
    h += `<div data-g="fixed" style="margin-top:8px"><button type="button" class="lrow" data-act="toggleFixed" aria-expanded="${S.fixedOpen}">
      <span class="av av28" style="color:var(--text-sub)" aria-hidden="true">${ic('calendar-sync')}</span>
      <span class="lrow-main"><span class="lrow-cat">毎月の支払い</span></span>
      <span class="lrow-amt num">${fmt(sum.fixedSum)}</span>${ic('chevron-down', 16)}</button>`;
    if (S.fixedOpen) {
      h += `<div>` + sum.fixedRows.slice().sort(byFixed(m)).map(listRow).join('');
      h += sum.deferredOut.map((e) => `<div class="lrow muted" style="cursor:default"><span class="av av28" aria-hidden="true"></span><span class="lrow-main"><span class="lrow-memo" style="font-size:var(--fs-lg)">${esc(tplLabel(e))}　${mShort(e.month)}に回しました</span></span></div>`).join('');
      h += `</div>`;
    }
    h += `</div>`;
  }
  return h + `<div class="list-end"></div></div>`;
}

/* S-11 記録「何に払った？」（§4 S-11）。記録タブのトップ（アプリはいつもここで開く）。答える問いは「いま何にいくら払った？」だけ。
   月切替は置かない（記録は月に関係しない。日付は S-12 の［今日｜昨日｜ほかの日］で決める）。カテゴリを押すと S-12 のシート（ここでは保存しない） */
function renderS11() {
  return `<div class="screen" data-screen="S-11" data-state="normal">
  <header class="appbar"><span></span><h1 class="appbar-plain" tabindex="-1">何に払った？</h1><span></span></header>${offlineLine()}
  <div class="s11-grid${S.offline ? ' tight' : ''}">${catGrid('pickCat', null)}</div>
</div>`;
}

/* S-12 記録（いくら？）（§4 S-12）。記録タブ（S-11）のカテゴリから開くシート。状態 empty / normal / action。
   縦の寸法（375×548）: つまみ 20 ＋ 見出し 44 ＋ 金額 48 ＋ テンキー 204 ＋ 間 8 ＋ 日付 44 ＋ 間 8 ＋ ラベル 22 ＋ 払った人 44 ＋ 間 12（4 ＋ 固定部分の上 8）＋ ボタン 48 ＋ 下 16 ＝ 518px */
SHEETS['S-12'] = (sh) => {
  const c = catOf(sh.cat);
  /* 注記は、これから保存する月（S-12 で選んでいる日付の月。既定は今日）の金額待ちの行に、選んだカテゴリの行があるとき */
  const hint = pendingShown(CALC.monthOf(recDate(sh))).some((e) => e.cat === sh.cat);
  const st = sh.err && sh.err.t === '金額を入れてください' ? 'empty' : (hint || sh.err) ? 'action' : 'normal';
  return `<div class="sh-root" data-screen="S-12" data-state="${st}">
  <div class="sh-head">
    <button type="button" class="backbtn" data-act="backToGrid" data-g="back" aria-label="カテゴリを選び直す（いまは${c.name}。押すとカテゴリに戻る）">${ic('chevron-left')}${ic(c.icon)}<span style="color:var(--text-main)">${c.name}</span></button>
    ${memoChip(sh)}
  </div>
  <div class="amt-row">${amtNote(sh, hint ? `<p class="note">金額待ちは支出タブの上から入れます</p>` : '')}${amountView(sh.amount, sh.shake)}</div>
  ${sh.memoMode ? memoInput(sh) : keypad()}
  <div style="margin-top:8px">${dateSeg(sh)}</div>
  <div style="margin-top:8px"><p class="lab" id="lab-payer">払った人</p>${payerSeg(sh.payer, 'setPayer', 'lab-payer')}</div>
  <div class="sh-foot" style="margin-top:4px"><button type="button" class="btn-fill" data-act="saveNew" data-g="save">記録する</button></div>
</div>`;
};

/* S-13 内訳（カテゴリ別）（§4 S-13）。横棒は灰色だけ（人の色は使わない）。状態 normal / action */
SHEETS['S-13'] = (sh) => {
  const sum = CALC.summarize(S.data.expenses, sh.m);
  const max = sum.byCat.length ? sum.byCat[0].amount : 1;
  return `<div class="sh-root" data-screen="S-13" data-state="${sum.pending.length ? 'action' : 'normal'}">
  <h2 class="sh-title" style="margin:4px 0 8px">${mShort(sh.m)}の内訳</h2>
  ${sum.byCat.map((x) => { const c = catOf(x.cat); return `<div style="padding:8px 0">
    <div class="kv"><span style="display:inline-flex;align-items:center;gap:8px;font-weight:500">${ic(c.icon, 20)}${c.name}</span><span class="num">${fmt(x.amount)}</span></div>
    <div class="hbar" aria-hidden="true"><i style="width:${(x.amount / max * 100).toFixed(1)}%"></i></div></div>`; }).join('')}
  ${sum.pending.length ? `<p class="note" style="margin-top:8px">金額待ち ${sum.pending.length}件は入っていません</p>` : ''}
</div>`;
};

/* S-14 記録を見る・直す（§4 S-14）。状態 own / partner / fixed / locked / unsent */
SHEETS['S-14'] = (sh) => {
  const e = MODEL.find(S.data, sh.rowId);
  if (!e) return '';
  if (sh.mode === 'partner' || sh.mode === 'locked') return s14View(sh, e);
  if (sh.grid) return `<div class="sh-root" data-screen="S-14" data-state="${sh.mode}">
    <h2 class="sh-title" style="margin:4px 0 12px">何に払った？</h2>${catGrid('s14Cat', sh.cat)}</div>`;
  if (sh.mode === 'fixed') return s14Fixed(sh, e);
  return s14Own(sh, e);
};
/* S-14 own（自分が記録した記録）・unsent（送れなかった記録） */
function s14Own(sh, e) {
  const c = catOf(sh.cat);
  const note = sh.mode === 'unsent'
    ? `送れませんでした: ${mShort(e.month)}は${statusOf(e.month) === 'settled' ? '精算済み' : '精算中'}です`
    : `記録 ${md(e.at)} ${hm(e.at)}${e.editedAt ? `・直した ${md(e.editedAt)} ${hm(e.editedAt)}` : ''}`;
  return `<div class="sh-root" data-screen="S-14" data-state="${sh.mode}">
  <div class="sh-head">
    <button type="button" class="chip" data-act="s14Grid" data-g="cat" aria-label="カテゴリを変える（いまは${c.name}）"><span class="chip-in" style="color:var(--text-main)">${ic(c.icon, 16)}${c.name}${ic('chevron-down', 16)}</span></button>
    ${memoChip(sh)}
  </div>
  <div class="amt-row">${amtNote(sh, `<p class="note">${esc(note)}</p>`)}${amountView(sh.amount, sh.shake)}</div>
  ${sh.memoMode ? memoInput(sh) : keypad()}
  <div style="margin-top:8px">${dateSeg(sh)}</div>
  <div style="margin-top:8px"><p class="lab" id="lab-payer14">払った人</p>${payerSeg(sh.payer, 'setPayer', 'lab-payer14')}</div>
  <div class="sh-foot split" style="margin-top:4px"><button type="button" class="btn-text danger" data-act="s14Delete" data-g="delete">削除</button><button type="button" class="btn-fill" data-act="s14Save" data-g="save">保存</button></div>
</div>`;
}
/* S-14 fixed（毎月の支払いから作られた行。2人とも直せる。カテゴリはひな形のまま） */
function s14Fixed(sh, e) {
  const c = catOf(e.cat);
  return `<div class="sh-root" data-screen="S-14" data-state="fixed">
  <h2 class="sh-title" style="display:flex;align-items:center;gap:8px;margin-top:4px">${ic(c.icon)}${esc(tplLabel(e))}</h2>
  <p class="note" style="margin-top:4px">毎月の支払いから・変わるのは今月の分だけ${e.amountBy ? `・金額: ${esc(whoName(e.amountBy))} ${md(e.amountAt)}` : ''}</p>
  <div class="amt-row">${amtNote(sh, '')}${amountView(sh.amount, sh.shake)}</div>
  ${keypad()}
  <div style="margin-top:8px"><p class="lab" id="lab-payer14f">払った人</p>${payerSeg(sh.payer, 'setPayer', 'lab-payer14f')}</div>
  <div class="sh-foot split" style="margin-top:12px"><button type="button" class="btn-text danger" data-act="s14Skip" data-g="skip">今月はなし</button><button type="button" class="btn-fill" data-act="s14Save" data-g="save">保存</button></div>
</div>`;
}
/* S-14 partner（相手の記録: 見るだけ）・locked（精算中・精算済みの月: 見るだけ ＋［精算を開く］E3） */
function s14View(sh, e) {
  const c = catOf(e.cat);
  const paid = e.payer === 'joint' ? '共用で払った' : `${whoName(e.payer)}が払った`;
  const amount = e.skipped ? '今月はなし' : e.amount == null ? '金額待ち' : yen(e.amount);
  const by = e.by === 'auto' ? '毎月の支払い' : whoName(e.by);
  /* 毎月の支払いから作られた行（locked のときだけ来る）は「毎月の支払いから」と、金額を入れた人・日（時刻は出さない） */
  const note = e.tpl
    ? `毎月の支払いから${e.amountBy ? `・金額: ${whoName(e.amountBy)} ${md(e.amountAt)}` : ''}`
    : `記録: ${by} ${md(e.at)} ${hm(e.at)}${e.editedAt ? `・直した ${md(e.editedAt)} ${hm(e.editedAt)}` : ''}`;
  return `<div class="sh-root" data-screen="S-14" data-state="${sh.mode}">
  <p class="big" data-big style="margin-top:4px">${amount}</p>
  <p style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:var(--fs-lg);font-weight:500">${ic(c.icon)}${c.name}</p>
  <p style="display:flex;align-items:center;gap:8px;margin-top:4px;font-size:var(--fs-lg)">${avatar(e.payer, 20, true)}${esc(paid)}</p>
  <p style="margin-top:4px;font-size:var(--fs-lg)">${dateLong(e.date)}</p>
  ${rowName(e) ? `<p style="margin-top:4px;font-size:var(--fs-lg);color:var(--text-sub)">${esc(rowName(e))}</p>` : ''}
  <hr class="divider">
  <p class="note">${esc(note)}</p>
  <p class="inl" style="margin-top:8px">${sh.mode === 'partner' ? '直せるのは記録した人だけです' : esc(lockMsg(e.month))}</p>
  ${sh.mode === 'locked' ? `<div style="margin-top:4px"><button type="button" class="btn-text" data-act="openSettleFrom" data-arg="${e.month}" data-g="open">精算を開く</button></div>` : ''}
</div>`;
}

/* S-15 金額を入れる（金額待ち）（§4 S-15・E1）。状態 empty / normal / action（精算から開いたとき） */
SHEETS['S-15'] = (sh) => {
  const e = MODEL.find(S.data, sh.queue[sh.idx]);
  if (!e) return '';
  const c = catOf(e.cat);
  const prev = S.data.expenses.find((x) => x.tpl === e.tpl && x.labelMonth === CALC.addMonth(e.labelMonth, -1) && x.amount != null && !x.skipped);
  /* 来月に回す: 条件は「翌月がロックされていない」だけ（月の途中でも選べる。§4 S-15・§6.3 ケースG） */
  const canDefer = !isLocked(CALC.addMonth(e.month, 1));
  const last = sh.idx === sh.queue.length - 1;
  const st = sh.err && sh.err.t === '金額を入れてください' ? 'empty' : sh.fromSettle ? 'action' : 'normal';
  return `<div class="sh-root" data-screen="S-15" data-state="${st}">
  ${sh.fromSettle ? `<p class="note">${sh.idx + 1} / ${sh.queue.length}</p>` : ''}
  <h2 class="sh-title" style="display:flex;align-items:center;gap:8px;margin-top:4px">${ic(c.icon)}${esc(tplLabel(e))}</h2>
  <p class="cap" style="display:flex;align-items:center;gap:6px;margin-top:4px">${avatar(e.payer, 20, true)}${e.payer === 'joint' ? '共用で払う' : esc(whoName(e.payer)) + 'が払う'}</p>
  <div class="amt-row">${amtNote(sh, prev ? `<p class="note-sm">先月 ${fmt(prev.amount)}</p>` : '')}${amountView(sh.amount, sh.shake)}</div>
  ${keypad()}
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
    ${canDefer ? `<button type="button" class="btn-text" data-act="s15Defer" data-g="defer">来月に回す</button>` : '<span></span>'}
    <button type="button" class="btn-text danger" data-act="s15Skip" data-g="skip">今月はなし</button>
  </div>
  <div class="sh-foot"><button type="button" class="btn-fill" data-act="s15Fill" data-g="fill">${sh.fromSettle && !last ? '次へ' : '入れる'}</button></div>
</div>`;
};

/* ===== 精算タブ（S-20〜S-22） ===== */

/* S-20 状態の1行（§1.4 状態ラベル） */
function s20StatusLine(st, mo, bothZero) {
  const M = mShort(mo.m);
  switch (st) {
    case 'undecided': return `${M}の出す額がまだです`;
    case 'estimate': return `見込み・${md(S.now)}時点`;
    case 'prep': return `精算のまえに あと${mo.pending.length}件`;
    case 'ready': return bothZero ? `${M}はお金を動かしません` : '精算できます';
    case 'transfer': return `${ic('lock', 14)}精算中`;
    case 'settled': return `${ic('lock', 14)}精算済み ${md(mo.rec.settledAt)}`;
    case 'redo': return 'やり直し中・済んだ分を引いています';
    default: return `${M}の出す額がまだです`;   /* empty も undecided と同じ文言（§1.4） */
  }
}
/* S-20 人のカード（§6.1: 1人1枚、同じ大きさ、向きは流れの印＋動詞、金額はいつも正）。
   外枠は押せない div。カード全体を覆う透明のボタンで S-22 を開き、チェックのボタンはその上に兄弟として重ねる（入れ子にしない）。
   タグは 0円のカードの「済み」だけ（見込みは状態の1行で示す）。msg はチェックのボタンで出したその場の1行（ボタンの直下） */
function settleCard(p, mo, st, msg) {
  const v = S.viewer, r = mo.remaining[p], tr = mo.transferred[p], chk = mo.checks[p];
  const est = st === 'estimate';
  let tag = '';
  let body = '';
  if (r === 0) {
    if (tr !== 0) body = `<p class="msg-zero">済み（${yen(tr)} ${tr > 0 ? '入れた' : '受け取った'}）</p>`;
    else { body = `<p class="msg-zero">動かすお金はありません</p>`; if (!est) tag = badge('済み'); }
  } else {
    const inn = r > 0;
    const verb = inn ? '共用へ入れる' : '共用から受け取る';
    const doneVerb = inn ? '入れた' : '受け取った';
    let btn = '';
    if (st === 'transfer' || st === 'settled') {
      /* 見た目は3つ: 塗り（自分の未チェック）／青い文字（相手の未チェック）／灰色の文字と ✓（付いたチェック。押すと外れる）。
         付いたチェックは「✓ 入れた」だけ。押した人と日時は読み上げ名と S-22 に出す */
      btn = chk
        ? `<button type="button" class="btn-text sub chkbtn" data-act="check" data-arg="${p}" data-g="check" aria-pressed="true" aria-label="${doneVerb} ${md(chk.at)} ${esc(whoName(chk.by))}（押すと外れる）">${ic('check', 16)}${doneVerb}</button>`
        : `<button type="button" class="${p === v ? 'btn-fill' : 'btn-text'} chkbtn" data-act="check" data-arg="${p}" data-g="check" aria-pressed="false">${doneVerb}</button>`;
    }
    body = `<div class="scard-f">${inn ? flow(p, 'joint', r) : flow('joint', p, r)}<span>${verb}</span></div>
      <div class="scard-a${btn ? ' has-chk' : ''}"><span class="big ${est ? 'est' : ''}" data-big>${tr !== 0 ? '<span class="ato">あと</span>' : ''}${yen(r)}</span>${btn}</div>`;
  }
  if (est && p === v && mo.sum.advRows[p].length === 0) body += `<p class="note" style="margin-top:6px">自分のお金で払ったら記録すると、この額から引かれます</p>`;
  return `<div class="scard" data-g="cards">
    <button type="button" class="scard-hit" data-act="openS22" data-arg="${p}" aria-label="${esc(whoName(p))}の内訳"></button>
    <div class="scard-h">${avatar(p, 28)}<span class="scard-name">${esc(whoName(p))}${selfMark(p)}</span>${tag}${ic('chevron-right', 16, 'scard-go')}</div>${body}${msg || ''}</div>`;
}
/* S-20 共用の行（カードにしない。灰色の家のアイコンと文。警告の色にしない）。
   出す額が共用の通帳でどう動くかを出すので、給料が共用に入る月は給料の残りも入れた額（jointBook）にする。
   給料が共用に入る人がいる月だけ、その下に注記「うち 給料の残り n円」を1行足す（いない月は jointBook ＝ jointNet で今までどおり1行） */
function jointLine(mo, st) {
  const j = mo.jointBook, est = st === 'estimate';
  const t = j > 0 ? `共用に <b class="num">${fmt(j)}円</b> ${est ? '残る見込み' : '残ります'}`
    : j < 0 ? `共用の残高から <b class="num">${fmt(j)}円</b> ${est ? '出る見込み' : '出ます'}`
    : (est ? '共用の残高は変わらない見込み' : '共用の残高は変わりません');
  const sub = mo.salaryLeft > 0 ? `<p class="note jline-sub">うち 給料の残り ${fmt(mo.salaryLeft)}円</p>` : '';
  return `<p class="jline">${avatar('joint', 20, true)}<span>${t}</span></p>${sub}`;
}
/* S-20 計算を見る ▾（数字の入った式は開いた先だけ。§6.1-5）。文字のボタン 16px semibold、開いているあいだは ▴ */
function calcSection(mo) {
  let h = `<div data-g="calc" style="margin-top:4px"><button type="button" class="btn-text" data-act="toggleCalc" aria-expanded="${S.calcOpen}">計算を見る ${ic(S.calcOpen ? 'chevron-up' : 'chevron-down', 16)}</button>`;
  if (S.calcOpen) {
    h += `<div class="calc">`;
    for (const p of ['a', 'b']) {
      const tr = mo.transferred[p];
      const js = mo.jointSalary[p];
      h += `<p class="calc-n">${esc(whoName(p))}${selfMark(p)}</p><p class="num">出す額 ${fmt(mo.contrib[p])} − もう払った分 ${fmt(mo.adv[p])}${js ? ` − 共用に入った給料 ${fmt(js)}` : ''}${tr ? ` ${tr > 0 ? '−' : '＋'} 済んだ分 ${fmt(tr)}` : ''}</p>`;
    }
    h += `<p class="calc-n">共用</p><p class="num">出す額の合計 ${fmt(mo.contrib.a + mo.contrib.b)} − 支出の合計 ${fmt(mo.total)}${mo.salaryLeft ? ` ＋ 給料の残り ${fmt(mo.salaryLeft)}` : ''}</p>`;
    if (!CALC.isLockedStatus(mo.status)) h += `<button type="button" class="btn-text" data-act="openS21">手取りを変える</button>`;
    h += `</div>`;
  }
  return h + `</div>`;
}
/* まだ決めていない人の、先月の手取り（S-20 undecided の出す額のブロックと［この額で決める］で同じものを使う） */
function undecidedNets(d, m) {
  const cm = d.contributions[m] || {}, pm = d.contributions[CALC.addMonth(m, -1)] || {}, nets = {};
  for (const p of ['a', 'b']) if (!cm[p] && pm[p]) nets[p] = pm[p].net;
  return nets;
}
/* S-20 undecided の出す額のブロック（先月の手取り × いまの出す割合。［この額で決める］で保存するのと同じ MODEL.decideContributions で出す） */
function decideBlock(m) {
  const d = S.data, cm = d.contributions[m] || {};
  const plan = MODEL.decideContributions(d, m, undecidedNets(d, m), S.viewer, today());
  let missing = false;
  const rows = ['a', 'b'].map((p) => {
    let amt, sub;
    if (cm[p]) { amt = yen(cm[p].amount); sub = `${ic('check', 12)} 決めた`; }
    else if (plan[p]) { amt = yen(plan[p].amount); sub = '先月の手取りで'; }
    else { amt = '—'; sub = ''; missing = true; }
    return `<div class="drow">${avatar(p, 28)}<span class="scard-name">${esc(whoName(p))}${selfMark(p)}</span><span class="big20" data-big>${amt}</span>${sub ? `<span class="note">${sub}</span>` : ''}</div>`;
  });
  return { html: `<div class="dblock">${rows.join('')}</div>`, missing };
}
/* 締め待ちの片付けの順（S-20 prep の「精算のまえに」の行と、精算から S-15 を順に開く順）:
   払う人が個人の行 → 共用の行。それぞれの中は対象月の古い順、同じならひな形の順（byTpl） */
const prepQueue = (mo) => mo.pending.slice().sort((x, y) => ((x.payer === 'joint') - (y.payer === 'joint')) || byTpl(x, y)).map((e) => e.id);

/* S-20 精算（月）（§4 S-20・§6）。状態 settled / transfer / empty / undecided / estimate / prep / redo / ready。
   estimate は「月の途中で、まだ精算を始めていない」状態。「この月を精算する」を押すと、その月だけ prep / ready に変わる（S.settleNow） */
function renderS20() {
  const d = S.data, m = S.month.S20;
  const mo = CALC.settleModel(d, m, S.now);
  const st = CALC.s20State(d, mo, S.settleNow);
  const bothZero = mo.decided && mo.remaining.a === 0 && mo.remaining.b === 0 && !mo.hasTransferred;
  /* その場の1行は押したボタンの直下に出す（at: main = 主ボタン、a・b = そのカードのチェック、redo = 精算をやり直す、status = 押したボタンが消えたとき） */
  const msgAt = (at) => (S.s20msg && S.s20msg.m === m && S.s20msg.at === at ? `<p class="${S.s20msg.kind === 'err' ? 'err' : 'inl'}" role="alert">${esc(S.s20msg.t)}</p>` : '');
  /* 数字の無い式は、チェックの記録が無いときだけ（redo と、やり直したあとの transfer・settled では出さない。済んだ分の合計が 0 でも）。
     その月に給料が共用に入る人がいるときも出さない（式に「− 共用に入った給料」が無く、カードの金額と合わなく見えるため。§6.1-5・§6.3 ケースN） */
  const showFormula = ['estimate', 'ready', 'transfer', 'settled'].includes(st) && !mo.hasDone
    && mo.jointSalary.a + mo.jointSalary.b === 0;
  let h = `<div class="screen" data-screen="S-20" data-state="${st}">` + monthBar('S20', m) + offlineLine();
  h += `<p class="stline" tabindex="-1"><span class="st-t">${s20StatusLine(st, mo, bothZero)}</span>${showFormula ? '<span class="st-sp" aria-hidden="true">　</span><span class="st-f">動かす額 ＝ 出す額 − もう払った分</span>' : ''}</p>`;
  h += msgAt('status');
  let foot = '', after = '';
  if (st === 'empty') {
    foot = `<button type="button" class="btn-fill" data-act="openS21" data-g="main">出す額を決める</button>`;
  } else if (st === 'undecided') {
    const b = decideBlock(m);
    h += b.html + `<div><button type="button" class="btn-text" data-act="openS21" data-g="net">手取りを変える</button></div>`;
    foot = b.missing ? `<button type="button" class="btn-fill" data-act="openS21" data-g="main">出す額を決める</button>`
      : `<button type="button" class="btn-fill" data-act="decideLast" data-g="main">この額で決める</button>`;
  } else if (st === 'prep') {
    const q = prepQueue(mo).map((id) => MODEL.find(d, id));
    h += `<ul class="prep-list">${q.slice(0, 3).map((e) => `<li>・${esc(tplLabel(e))}の金額</li>`).join('')}${q.length > 3 ? `<li>・ほか ${q.length - 3}件</li>` : ''}</ul>`;
    h += `<p class="note-sm">金額が決まると、動かす額が出ます</p>`;
    foot = `<button type="button" class="btn-fill" data-act="prepFill" data-g="main">金額を入れる</button>`;
  } else {
    h += settleCard('a', mo, st, msgAt('a')) + settleCard('b', mo, st, msgAt('b'));
    h += jointLine(mo, st);
    if (st === 'estimate' && mo.pending.length) h += `<p class="note" style="margin-top:2px">金額待ち ${mo.pending.length}件を含みません</p>`;
    h += calcSection(mo);
    /* 月の途中でも精算を始められる（§4.0.2）。塗りの青は増やさず、固定部分の中の文字ボタンにする（「計算を見る」の下） */
    if (st === 'estimate') foot = `<button type="button" class="btn-text" data-act="settleNow" data-g="settle">この月を精算する</button>`;
    if (st === 'ready' || st === 'redo') foot = `<button type="button" class="btn-fill" data-act="confirm" data-g="main">この金額で精算</button>`;
    if (st === 'transfer' || st === 'settled') after = `<div style="margin:8px 0 16px"><button type="button" class="btn-text sub" data-act="reopen" data-g="redo">精算をやり直す</button>${msgAt('redo')}</div>`;
  }
  /* 固定部分にその場の1行が出ているあいだは with-msg（上 4・1行の上 2・下 0 で 72px に抑える。§4 S-20 ready の縦の寸法） */
  if (foot) { const fm = msgAt('main'); h += `<div class="s20-foot${fm ? ' with-msg' : ''}${st === 'estimate' ? ' text-only' : ''}">${foot}${fm}</div>`; }
  return h + after + `</div>`;
}

/* S-21 出す額（§4 S-21・E5）。手取りの欄を押すとテンキーの入力先になる。状態 empty / normal / action */
/* 縦の寸法（375×548）: つまみ 20 ＋ 見出し 28 ＋ 行 80×2 ＋ 行の間 8 ＋ 間 12 ＋ テンキー 204 ＋ 間 12 ＋ ボタン 48 ＋ 下 16 ＝ 508px。
   その場の1行（手取りを入れてください・オンラインで直せます）は見出しの行の右に出し、高さを増やさない。
   欄が空かどうかは net !== '' で見る（手取り 0 も入れられる。空の欄は文字を置かず、出す額も出さない） */
SHEETS['S-21'] = (sh) => {
  const d = S.data, m = sh.m, cm = d.contributions[m] || {};
  /* 出す額は［決める］で保存するのと同じ MODEL.decideContributions で出す（決め直しても、保存済みの割合を使う） */
  const nets = {};
  for (const p of ['a', 'b']) if (sh.net[p] !== '') nets[p] = Number(sh.net[p]);
  const plan = MODEL.decideContributions(d, m, nets, S.viewer, today());
  const rows = ['a', 'b'].map((p) => {
    const rate = CALC.rateFor(d, m, p);
    const net = sh.net[p], has = net !== '';
    /* 給料が共用に入る人の行には小さく添える（設定への導線は置かない。B16） */
    const sj = CALC.salaryToJointFor(d, m, p);
    return `<div class="s21row">
      <div class="s21h">${avatar(p, 28)}<span class="scard-name">${esc(whoName(p))}${selfMark(p)}</span>${sj ? `<span class="note note-sj">給料は共用に入る</span>` : ''}${cm[p] ? `<span class="note note-decided">決めた: ${esc(whoName(cm[p].by))} ${md(cm[p].at)}</span>` : ''}</div>
      <div class="s21f"><span id="net-lab-${p}">手取り</span><button type="button" class="netfield ${sh.target === p ? 'on' : ''}" id="net-${p}" data-act="netTarget" data-arg="${p}" data-g="net-${p}" aria-pressed="${sh.target === p}" aria-label="${esc(whoName(p))}の手取り ${has ? fmt(Number(net)) + '円' : '未入力'}">${has ? fmt(Number(net)) : ''}</button><span style="white-space:nowrap">× ${rate}% ＝</span><span class="big20 s21amt" data-big>${has ? yen(plan[p].amount) : ''}</span></div>
    </div>`;
  }).join('');
  const st = sh.err ? 'action' : sh.initEmpty ? 'empty' : 'normal';
  return `<div class="sh-root" data-screen="S-21" data-state="${st}">
  <div class="s21-head"><h2 class="sh-title">${mShort(m)}の出す額</h2>${sh.err ? `<p class="${sh.err.kind === 'err' ? 'err' : 'inl'}" role="alert">${esc(sh.err.t)}</p>` : ''}</div>
  ${rows}
  <div style="margin-top:12px">${keypad()}</div>
  <div class="sh-foot" style="margin-top:4px"><button type="button" class="btn-fill" data-act="s21Decide" data-g="decide">決める</button></div>
</div>`;
};

/* S-22 1人ぶんの内訳（§4 S-22・E4）。見るだけ。状態キーは S-20 の状態キーをそのまま使う（estimate・ready・transfer・settled・redo）。
   並び: 見出しの行 ／ 区切り ／ 出す額・手取り × 割合・もう払った分（・済んだ分） ／ 区切り ／ 結果の行（流れの印＋動詞 ／ 24px bold の動かす額）。
   動詞と金額は結果の行にだけ出す（一番大きく見せるものは結果の行の動かす額） */
const S22_STATES = ['estimate', 'ready', 'transfer', 'settled', 'redo'];   /* S-20 がカードを出す状態だけで開く */
SHEETS['S-22'] = (sh) => {
  const d = S.data, mo = CALC.settleModel(d, sh.m, S.now), st = CALC.s20State(d, mo, S.settleNow), p = sh.p;
  if (!S22_STATES.includes(st) || !mo.decided) return '';   /* 空を返すと renderSheet が閉じる */
  const r = mo.remaining[p], tr = mo.transferred[p];
  const inn = r > 0, verb = inn ? '共用へ入れる' : '共用から受け取る';
  const rows = mo.sum.advRows[p].slice().sort(byNewest);
  let h = `<div class="sh-root" data-screen="S-22" data-state="${st}">
  <div class="scard-h" style="margin-top:4px">${avatar(p, 28)}<span class="scard-name">${esc(whoName(p))}${selfMark(p)}</span>${st === 'estimate' ? badge('見込み') : ''}</div>`;
  h += `<hr class="divider">
  <div class="kv"><span>出す額</span><span class="num">${fmt(mo.contrib[p])}</span></div>
  ${mo.net[p] != null ? `<div class="kv sub"><span>手取り ${fmt(mo.net[p])} × ${mo.ratePct[p]}%</span></div>` : ''}
  <div class="kv"><span>もう払った分</span><span class="num">− ${fmt(mo.adv[p])}</span></div>
  ${mo.jointSalary[p] ? `<div class="kv"><span>共用に入った給料</span><span class="num">− ${fmt(mo.jointSalary[p])}</span></div>
  <div class="kv sub"><span>手取り ${fmt(mo.net[p])} のうち 出す額まで</span></div>` : ''}
  ${(mo.done[p] || []).map((x) => `<div class="kv"><span>済んだ分（${md(x.at)} ${x.amount > 0 ? '入れた' : '受け取った'}）</span><span class="num">${x.amount > 0 ? '−' : '＋'} ${fmt(x.amount)}</span></div>`).join('')}
  <hr class="divider">`;
  /* 結果の行: 動かすお金があれば 1段目 流れの印＋動詞、2段目 金額（24px bold・右揃え。redo は「あと ¥3,300」、見込みは --text-sub）。
     0円なら「済み（¥65,930 入れた）」／「動かすお金はありません」を 16px semibold の1段で */
  if (r === 0) h += `<p style="font-size:var(--fs-lg);font-weight:600;line-height:var(--lh-ui)">${tr ? `済み（${yen(tr)} ${tr > 0 ? '入れた' : '受け取った'}）` : '動かすお金はありません'}</p>`;
  else h += `<div class="scard-f" style="margin-top:0">${inn ? flow(p, 'joint', r) : flow('joint', p, r)}<span>${verb}</span></div>
    <p class="num s22-amt${st === 'estimate' ? ' est' : ''}" data-big>${tr ? '<span class="ato">あと</span>' : ''}${yen(r)}</p>`;
  /* transfer・settled でこのカードにチェックがあるときは、押した人と日時（S-20 のボタンは「✓ 入れた」だけ） */
  const chk = mo.checks[p];
  if ((st === 'transfer' || st === 'settled') && chk && r !== 0) h += `<p class="note" style="margin-top:4px">${r > 0 ? '入れた' : '受け取った'}: ${md(chk.at)} ${esc(whoName(chk.by))}</p>`;
  if (st === 'estimate') {
    const pend = mo.pending.filter((e) => e.payer === p);
    if (pend.length) h += `<p class="note" style="margin-top:6px">${pend.map((e) => esc(tplLabel(e))).join('・')}は金額待ちで入っていません</p>`;
  }
  h += `<h3 class="sec" style="margin-top:16px">もう払った分（${rows.length}件）</h3><div class="s22-list">`;
  h += rows.map((e) => `<div class="lrow" style="cursor:default"><span class="num" style="width:40px;flex:none;font-size:var(--fs-body-sm);color:var(--text-sub)">${md(e.date)}</span>
    <span class="lrow-main"><span class="lrow-cat">${catOf(e.cat).name}</span><span class="lrow-memo">${esc(rowName(e))}</span>${e.tpl ? badge('毎月') : ''}</span><span class="lrow-amt num">${fmt(e.amount)}</span></div>`).join('');
  h += `</div><p class="note" style="margin:8px 0 8px">共用で払ったものは入りません</p></div>`;
  return h;
};

/* ===== 設定タブ（S-30〜S-34） ===== */
const activeTemplates = () => S.data.templates.filter((t) => !t.until);

/* S-30 設定（§4 S-30）。状態 empty / normal。塗りの青は置かない。
   縦の余白は詰めてある（見出しの上下 4〜8px・グループ間 4px・下 8px）。「記録の払った人」の行が増えた分、
   375×548 でスクロールが要らないようにするため（セグメントの 44px と行のタップ領域 56px は変えない） */
function renderS30() {
  const d = S.data, v = S.viewer;
  const act = activeTemplates();
  return `<div class="screen" data-screen="S-30" data-state="${act.length ? 'normal' : 'empty'}">
  <header class="appbar"><span></span><h1 class="appbar-plain" tabindex="-1">設定</h1><span></span></header>${offlineLine()}
  <h2 class="sec" style="margin:4px 0">ふたりの設定</h2>
  <div class="sgroup" data-g="people">${['a', 'b'].map((p) => `<button type="button" class="srow" data-act="openS33" data-arg="${p}">${avatar(p, 28)}<span class="grow">${esc(whoName(p))}${selfMark(p)}</span><span class="val">出す割合 ${d.people[p].ratePct}%</span>${ic('chevron-right')}</button>`).join('')}</div>
  <div class="sgroup" style="margin-top:4px" data-g="tpl"><button type="button" class="srow" data-act="openS31">
    <span class="av av28" style="color:var(--text-sub)" aria-hidden="true">${ic('calendar-sync')}</span>
    <span class="grow">毎月の支払い</span>
    <span class="val num">${act.length ? `${act.length}件` : 'まだありません'}</span>${ic('chevron-right')}</button></div>
  <h2 class="sec" style="margin:8px 0 4px">自分（${esc(whoName(v))}）</h2>
  <div class="sgroup" style="margin-bottom:8px">
    <div class="srow-seg"><span class="slab">記録の払った人</span>${textSeg('記録の払った人', [['self', '自分'], ['joint', '共用']], d.people[v].defaultPayer, 'setDefaultPayer', 'defpayer', 'defpayer')}${S.s30msg ? `<p class="inl" role="alert" style="margin-top:4px">${esc(S.s30msg)}</p>` : ''}</div>
    <button type="button" class="srow" data-act="openS34" data-g="pw"><span class="grow">パスワードを変える</span>${ic('chevron-right')}</button>
    ${S.safari ? `<button type="button" class="srow" data-act="openS03" data-g="a2hs"><span class="grow">ホーム画面に追加</span>${ic('chevron-right')}</button>` : ''}
    <button type="button" class="srow" data-act="logout" data-g="logout" style="color:var(--text-accent);font-weight:600">ログアウト</button>
  </div>
</div>`;
}

/* S-31 毎月の支払い（§4 S-31）。並びは 毎月同じ（金額の多い順）→ 金額待ち。状態 empty / normal */
function renderS31() {
  const act = activeTemplates();
  const fixed = act.filter((t) => t.kind === 'fixed').sort((x, y) => y.amount - x.amount);
  const vari = act.filter((t) => t.kind === 'variable');
  const fsum = fixed.reduce((s, t) => s + t.amount, 0);
  let h = `<div class="screen" data-screen="S-31" data-state="${act.length ? 'normal' : 'empty'}">
  <header class="appbar left"><button type="button" class="backbtn" data-act="backToS30" data-g="back">${ic('chevron-left')}設定</button><h1 class="appbar-plain" tabindex="-1">毎月の支払い</h1><span></span></header>${offlineLine()}`;
  if (!act.length) {
    h += `<p class="msg" style="margin-top:24px">毎月の支払いを入れると、毎月自動で記録されます</p>
    <div style="margin-top:16px"><button type="button" class="btn-fill" data-act="openS32" data-g="add">${ic('plus')}追加</button></div>`;
    return h + `</div>`;
  }
  h += `<p class="total" data-big style="margin-top:8px">毎月 ${yen(fsum)}</p>`;
  if (vari.length) h += `<p class="note-sm">＋ 金額待ち ${vari.length}件</p>`;
  h += `<div class="sgroup" style="margin-top:16px" data-g="rows">` + [...fixed, ...vari].map((t) => `<button type="button" class="srow" data-act="openS32" data-arg="${t.id}">
    ${ic(catOf(t.cat).icon)}<span class="grow">${esc(t.name)}</span>
    <span class="val" style="display:inline-flex;align-items:center;gap:4px">${avatar(t.payer, 20, true)}${esc(whoName(t.payer))}</span>
    <span class="num" style="min-width:76px;text-align:right;font-weight:600">${t.kind === 'fixed' ? fmt(t.amount) : '<span class="dash-tag">金額待ち</span>'}</span></button>`).join('') + `</div>`;
  h += `<div class="sgroup" style="margin:8px 0 24px" data-g="add"><button type="button" class="srow" data-act="openS32" style="color:var(--text-accent);font-weight:600">${ic('plus')}追加</button></div>`;
  return h + `</div>`;
}

/* S-32 毎月の支払いを追加・直す（§4 S-32・§6.5）。状態 empty（追加）/ normal（直す）/ action */
/* 見出しは置かない（名前の欄が一番大きく見せるもの）。シートの読み上げ名は sheetLabel()。高いシート（TALL）。
   直すときは下端を 左「支払いをやめる」（赤い文字）・右［保存］にする（S-14 と同じ形）。欄に結びつかない1行（オンラインで直せます）は固定部分の直上 */
SHEETS['S-32'] = (sh) => {
  const editing = !!sh.tplId;
  const st = sh.err ? 'action' : editing ? 'normal' : 'empty';
  if (sh.grid) return `<div class="sh-root" data-screen="S-32" data-state="${st}"><h2 class="sh-title" style="margin:4px 0 12px">カテゴリ</h2>${catGrid('s32Cat', sh.cat)}</div>`;
  const fromM = isLocked(curMonth()) ? CALC.addMonth(curMonth(), 1) : curMonth();
  const effM = CALC.addMonth(curMonth(), 1);
  /* 金額の欄は、受け付けない値が入っているあいだも赤い枠（amountBad） */
  const isBad = (k) => !!(sh.err && sh.err.field === k) || (k === 'amount' && !!sh.amountBad);
  const bad = (k) => (isBad(k) ? 'bad' : '');
  const inv = (k) => (isBad(k) ? ' aria-invalid="true"' : '');
  return `<div class="sh-root" data-screen="S-32" data-state="${st}">
  <div class="field" data-g="name" style="margin-top:4px"><label for="tpl-name">名前</label><input class="inp ${bad('name')}" id="tpl-name" value="${esc(sh.name)}" data-in="tplName" autocomplete="off" enterkeyhint="done"${inv('name')}>${errLine(sh, 'name')}</div>
  <div class="field" data-g="cat"><span class="flab" id="lab-tplcat">カテゴリ</span><div id="tpl-cat-wrap">${s32CatChip(sh)}</div>${errLine(sh, 'cat')}</div>
  <div class="field"><span class="flab" id="lab-tplpayer">払う人</span>${payerSeg(sh.payer, 's32Payer', 'lab-tplpayer')}</div>
  <div class="field"><span class="flab" id="lab-tplkind">金額</span>${textSeg('金額', [['fixed', '毎月同じ'], ['variable', '金額待ち']], sh.kind, 's32Kind', 'tpl-kind', 'kind')}
    ${sh.kind === 'fixed' ? `<div class="pre" data-g="amount" style="margin-top:8px"><span>¥</span><input class="inp num ${bad('amount')}" id="tpl-amount" inputmode="numeric" pattern="[0-9]*" value="${esc(sh.amount)}" data-in="tplAmount" aria-label="毎月の金額" autocomplete="off"${inv('amount')}></div>` : ''}${errLine(sh, 'amount')}</div>
  <p class="note" style="margin-top:8px">${editing ? `変更は${mShort(effM)}分から` : `${mShort(fromM)}分から記録します`}</p>
  ${errLine(sh, null)}
  <div class="sh-foot${editing ? ' split' : ''}" style="margin-top:8px">${editing ? `<button type="button" class="btn-text danger" data-act="s32Stop" data-g="stop">支払いをやめる</button>` : ''}<button type="button" class="btn-fill" data-act="s32Save" data-g="save">保存</button></div>
</div>`;
};
function s32CatChip(sh) {
  const c = sh.cat ? catOf(sh.cat) : null;
  return `<button type="button" class="chip" id="tpl-cat" data-act="s32Grid" aria-labelledby="lab-tplcat tpl-cat"><span class="chip-in" style="color:var(--text-main);${sh.err && sh.err.field === 'cat' ? 'outline:1px solid var(--border-danger)' : ''}">${c ? ic(c.icon, 16) + c.name : '選ぶ'}${ic('chevron-down', 16)}</span></button>`;
}

/* S-33 人の設定（§4 S-33）。相手の行も開ける。状態 normal（自分の行）/ partner（相手の行）/ action。
   呼び名と色は2人とも変えられる（相手の打ち間違いを直せるように）。
   出す割合と給料の入り先は本人だけ（§2.2）。相手の行では読み取り専用の値にして、「本人だけが変えられます」を添える */
SHEETS['S-33'] = (sh) => {
  const self = sh.p === S.viewer;
  const sj = !!sh.salaryToJoint;   /* 下書き（［保存］で保存する）。相手の行は読み取り専用なので S.data と同じ値のまま */
  return `<div class="sh-root" data-screen="S-33" data-state="${sh.err ? 'action' : (self ? 'normal' : 'partner')}">
  <div style="display:flex;justify-content:center;margin-top:4px"><span class="av av56 av-${sh.color}" id="s33-av" aria-hidden="true">${esc([...sh.name][0] || '')}</span></div>
  <div class="field" data-g="name"><label for="p-name">呼び名</label><input class="inp ${sh.err && sh.err.field === 'name' ? 'bad' : ''}" id="p-name" value="${esc(sh.name)}" data-in="pName" autocomplete="off"${sh.err && sh.err.field === 'name' ? ' aria-invalid="true"' : ''}>${errLine(sh, 'name')}</div>
  <div class="field" data-g="color"><span class="flab" id="lab-color">色</span><div class="colors" role="radiogroup" aria-labelledby="lab-color">${['a', 'b'].map((c) =>
    `<button type="button" role="radio" aria-checked="${c === sh.color}" class="colorbtn ${c === sh.color ? 'on' : ''}" id="p-color-${c}" data-act="s33Color" data-arg="${c}" aria-label="${c === 'a' ? 'ティール' : 'アンバー'}"><span class="cpick-${c}">${c === sh.color ? ic('check', 16) : ''}</span></button>`).join('')}</div></div>
  ${self
    ? `<div class="field" data-g="rate"><label for="p-rate">出す割合</label><div style="display:flex;align-items:center;gap:8px"><input class="inp num ${sh.err && sh.err.field === 'rate' ? 'bad' : ''}" id="p-rate" inputmode="numeric" pattern="[0-9]*" value="${esc(sh.rate)}" data-in="pRate" style="max-width:120px;text-align:right" autocomplete="off"${sh.err && sh.err.field === 'rate' ? ' aria-invalid="true"' : ''}><span style="font-size:var(--fs-lg)">%</span></div>${errLine(sh, 'rate')}</div>
  <div class="field" data-g="salary"><span class="flab" id="lab-salary">給料の入り先</span>${textSeg('給料の入り先', [['self', '自分の口座'], ['joint', '共用口座']], sj ? 'joint' : 'self', 's33Salary', 'p-salary', 'salary')}</div>
  <p class="note" style="margin-top:8px">割合は次に決める月から、給料の入り先は決め直した月から</p>`
    : `<div class="field"><span class="flab">出す割合</span><p class="rov num">${esc(sh.rate)}%</p></div>
  <div class="field"><span class="flab">給料の入り先</span><p class="rov">${sj ? '共用口座' : '自分の口座'}</p></div>
  <p class="ro-note">本人だけが変えられます</p>`}
  ${errLine(sh, null)}
  <div class="sh-foot" style="margin-top:12px"><button type="button" class="btn-fill" data-act="s33Save" data-g="save">保存</button></div>
</div>`;
};

/* S-34 パスワードを変える（§4 S-34）。状態 normal（入力前・入力中）/ action。
   欄の1行（8文字以上にしてください）は欄の下、欄に結びつかない1行（オンラインで直せます）は注記と固定部分のあいだ（S-33 と同じ形）。
   赤い枠と aria-invalid は欄の1行のときだけ */
SHEETS['S-34'] = (sh) => { const bad = !!(sh.err && sh.err.field === 'pw'); return `<div class="sh-root" data-screen="S-34" data-state="${sh.err ? 'action' : 'normal'}">
  <h2 class="sh-title" style="margin-top:4px"><label for="new-pw">パスワードを変える</label></h2>
  <div class="field" data-g="pw"><div class="pw"><input class="inp ${bad ? 'bad' : ''}" id="new-pw" type="${sh.show ? 'text' : 'password'}" autocomplete="new-password" value="${esc(sh.pw)}" data-in="newPw"${bad ? ' aria-invalid="true"' : ''}>
    <button type="button" class="iconbtn" data-act="s34Eye" aria-label="${sh.show ? 'パスワードを隠す' : 'パスワードを表示'}" aria-pressed="${sh.show}">${ic(sh.show ? 'eye-off' : 'eye')}</button></div>${errLine(sh, 'pw')}</div>
  <p class="note" style="margin-top:6px">12文字以上がおすすめです</p>
  ${errLine(sh, null)}
  <div class="sh-foot" style="margin-top:12px"><button type="button" class="btn-fill" data-act="s34Save" data-g="save">変える</button></div>
</div>`; };

/* ===== 画面の組み立て（ページ・タブバー・シート・トースト） ===== */
function renderPage() {
  if (S.auth === 'out') return { html: renderS01(), key: 'S-01', tabbar: false };
  if (S.route === 'S-02') return { html: renderS02(), key: 'S-02', tabbar: false };
  if (S.tab === 'S-11') return { html: renderS11(), key: 'S-11', tabbar: true };
  if (S.tab === 'S-10') return { html: renderS10(), key: 'S-10:' + S.month.S10, tabbar: true };
  if (S.tab === 'S-20') return { html: renderS20(), key: 'S-20:' + S.month.S20, tabbar: true };
  if (S.sub === 'S-31') return { html: renderS31(), key: 'S-31', tabbar: true };
  return { html: renderS30(), key: 'S-30', tabbar: true };
}
/* §3.1 タブバーと §3.2 赤い点 */
function renderTabbar(show) {
  const nav = $('#tabbar');
  nav.hidden = !show;
  if (!show) return;
  const dot = !!CALC.attention(S.data, S.viewer, S.now);
  nav.innerHTML = [['S-11', 'circle-plus', '記録'], ['S-10', 'receipt-text', '支出'], ['S-20', 'arrow-left-right', '精算'], ['S-30', 'settings', '設定']].map(([t, icon, label]) =>
    `<button type="button" class="tab ${S.tab === t ? 'on' : ''}" data-act="tab" data-arg="${t}" ${S.tab === t ? 'aria-current="page"' : ''}><span class="tab-ic">${ic(icon, 24)}${t === 'S-20' && dot ? '<span class="dot"></span><span class="sr">（やることがあります）</span>' : ''}</span><span>${label}</span></button>`).join('');
}
function renderSheet() {
  const el = $('#sheet'), bd = $('#backdrop');
  const inertEls = ['#page', '#tabbar'].map((s) => $(s));
  /* 中身が作れないシート（行が消えた・出す額が無い など）は、空のシートを出さずに閉じた状態で描く */
  const inner = S.sheet ? SHEETS[S.sheet.id](S.sheet) : '';
  if (!inner) {
    dropSheet();
    el.hidden = true; bd.hidden = true; el.innerHTML = ''; el.style.bottom = ''; el.style.maxHeight = ''; el.removeAttribute('tabindex');
    inertEls.forEach((x) => x.removeAttribute('inert'));
    return;
  }
  const id = S.sheet.id;
  el.hidden = false; bd.hidden = false;
  el.className = 'sheet' + (TALL.has(id) ? ' tall' : '') + (S.sheetEnter ? ' enter' : '');
  /* つまみは見た目を変えずに「閉じる」の読み上げ名を持つボタン（押すと背景のタップと同じく閉じる。下へのスワイプでも閉じる） */
  el.innerHTML = `<button type="button" class="grip" data-grip data-act="closeSheet" aria-label="閉じる"></button>` + inner;
  el.setAttribute('aria-label', sheetLabel(S.sheet));
  inertEls.forEach((x) => x.setAttribute('inert', ''));
  if (S.sheetEnter) { el.scrollTop = 0; setTimeout(() => el.classList.remove('enter'), 260); }
  S.sheetEnter = false;
  if (S.sheet.shake) S.sheet.shake = false;
}
function renderToast() {
  const t = $('#toast');
  t.classList.toggle('nobar', $('#tabbar').hidden);
  /* 表示中のトーストが同じなら中身を作り直さない（role="status" の読み上げを1回にする。§3.7）。位置は毎回合わせる */
  if (t._shown !== S.toast) {
    t.innerHTML = S.toast ? `<span class="toast-t">${esc(S.toast.text)}</span>${S.toast.undo ? `<button type="button" class="toast-u" data-act="undo">元に戻す</button>` : ''}` : '';
    t._shown = S.toast;
  }
  /* S-20 に下端の固定部分（.s20-foot）があるときは、その上端の 8px 上に出す（主ボタンを隠さない） */
  const foot = S.toast && !S.sheet ? $('#page .s20-foot') : null;
  if (foot) { const ar = $('#app').getBoundingClientRect(), fr = foot.getBoundingClientRect(); t.style.bottom = Math.round(ar.bottom - fr.top + 8) + 'px'; }
  else t.style.bottom = '';
}
function showToast(text, undo) {
  clearTimeout(S.toastTimer);
  S.toast = { text, undo: undo || null };
  S.toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, S.toastLong ? 30000 : 6000);
}
function hideToast() { clearTimeout(S.toastTimer); S.toast = null; }

/* フォーカスの受け渡し（§4.0.3）: 描き直して消えた要素は、同じ data-act・data-arg（無ければ同じ id）の要素へ戻す */
function focusTargetOf(pf, scope) {
  if (!pf) return null;
  if (pf.el && pf.el.isConnected && !pf.el.closest('[inert]')) return pf.el;
  const root = scope || $('#app');
  if (pf.act) {
    const sel = `[data-act="${CSS.escape(pf.act)}"]` + (pf.arg != null ? `[data-arg="${CSS.escape(pf.arg)}"]` : ':not([data-arg])');
    const t = [...root.querySelectorAll(sel)].find((x) => !x.closest('[inert]'));
    if (t) return t;
  }
  if (pf.id) { const t = document.getElementById(pf.id); if (t && root.contains(t) && !t.closest('[inert]')) return t; }
  return null;
}
/* シートを開いたら、中身の最初の操作へ（つまみは除く）。操作が無ければシート自身（tabindex=-1）。
   例外は2つ（§4.0.3）: S-21 は入力先の欄（開いた時点では閲覧者の欄）へ、S-04 はいま見ている月のマスへ */
function focusSheetStart() {
  const el = $('#sheet');
  const net = S.sheet && S.sheet.id === 'S-21' ? document.getElementById('net-' + S.sheet.target) : null;
  if (net && el.contains(net)) { el.removeAttribute('tabindex'); net.focus({ preventScroll: true }); return; }
  /* S-04 は、いま見ている月のマスへ（その年に無いときは、その年で選べる最初のマス）。§4.0.3・S-04 */
  const mcell = S.sheet && S.sheet.id === 'S-04' ? (el.querySelector('.mcell.on') || el.querySelector('.mgrid button')) : null;
  if (mcell) { el.removeAttribute('tabindex'); mcell.focus({ preventScroll: true }); return; }
  const first = [...el.querySelectorAll('.sh-root button, .sh-root input, .sh-root select, .sh-root textarea, .sh-root [tabindex]')]
    .find((x) => !x.disabled && x.getAttribute('tabindex') !== '-1' && !x.closest('[aria-hidden="true"]') && x.getClientRects().length);
  if (first) { el.removeAttribute('tabindex'); first.focus({ preventScroll: true }); }
  else { el.setAttribute('tabindex', '-1'); el.focus({ preventScroll: true }); }
}

/* 戻し先も同じ操作の要素も無いとき（§4.0.3）: S-20 は固定部分の主ボタン、無ければ状態の1行。ほかのページは上部バーの見出し */
function focusFallback() {
  const page = $('#page');
  let t = null;
  if (page.querySelector('[data-screen="S-20"]')) t = page.querySelector('.s20-foot [data-g="main"]') || page.querySelector('.stline');
  if (!t) t = page.querySelector('.appbar-title, .appbar-plain');
  if (t) t.focus({ preventScroll: true });
}

/* すべて描き直す（状態 → 画面）。スクロール位置は同じページなら保つ */
function render() {
  S.renderCount++;
  if (window.__mockBeforeRender) window.__mockBeforeRender();
  /* 描く前に、フォーカスしていた要素（data-act・data-arg・id）と、シートが開いていたかを覚える */
  const app = $('#app'), sheetEl = $('#sheet');
  const wasOpen = !sheetEl.hidden;
  const ae = document.activeElement;
  const inApp = !!ae && ae !== document.body && app.contains(ae);
  const focusFree = !ae || ae === document.body || inApp;   /* モック操作パネルにフォーカスがあるときは動かさない */
  const prev = inApp ? { el: ae, act: ae.getAttribute('data-act'), arg: ae.getAttribute('data-arg'), id: ae.id, inSheet: sheetEl.contains(ae) } : null;

  const page = $('#page');
  const prevKey = page.dataset.key, prevTop = page.scrollTop;
  const r = renderPage();
  page.innerHTML = r.html;
  page.classList.toggle('with-tabbar', r.tabbar);
  page.scrollTop = prevKey === r.key ? prevTop : 0;
  page.dataset.key = r.key;
  renderTabbar(r.tabbar); renderSheet(); renderToast();
  $('.appbar', page) && $('.appbar', page).classList.toggle('scrolled', page.scrollTop > 4);
  if (S.highlight && !S.sheet) {
    const row = document.getElementById('row-' + S.highlight);
    if (row) row.scrollIntoView({ block: 'center' });
    /* 1.3秒で外して描き直す（reduced-motion で色だけ残したハイライトも元の地に戻る） */
    const id = S.highlight; setTimeout(() => { if (S.highlight === id) { S.highlight = null; render(); } }, 1300);
  }

  const isOpen = !!S.sheet;
  if (isOpen && !wasOpen) {
    /* 開いた: 開く前にフォーカスしていた要素を覚え、シートの最初の操作へ */
    S.returnFocus = prev && !prev.inSheet ? prev : null;
    if (focusFree) focusSheetStart();
  } else if (!isOpen && wasOpen) {
    /* 閉じた: 覚えた要素へ戻す（描き直して消えていたら同じ data-act・data-arg の要素へ） */
    const t = focusFree ? focusTargetOf(S.returnFocus) : null;
    S.returnFocus = null;
    if (t) t.focus({ preventScroll: true });
    else if (focusFree) focusFallback();
    announce('');
  } else if (prev && (!prev.el.isConnected || prev.el.closest('[inert]'))) {
    /* 同じ画面の描き直し（テンキー・カテゴリ・セグメントなど）: 同じ操作の要素へ戻す */
    const t = focusTargetOf(prev, prev.inSheet && isOpen ? sheetEl : app);
    if (t) t.focus({ preventScroll: true });
    else if (prev.inSheet && isOpen) focusSheetStart();
    else focusFallback();
  }
  if (S.sheet && S.sheet.focus) { const f = document.getElementById(S.sheet.focus); S.sheet.focus = null; if (f) f.focus(); }
  if (window.__mockAfterRender) window.__mockAfterRender();
}

/* ---------------------------------------------------------------------
   9. ACTIONS — 画面の操作（data-act / data-in / data-change / data-blur）
      書き込みは commit() で包み、6秒の「元に戻す」を出す（P6・§3.7）
   --------------------------------------------------------------------- */
const ACT = {}, INPUT = {}, CHANGE = {}, BLUR = {};

/* 取り消せる操作: 前のデータを覚えてから実行し、fn が返した文言でトーストを出す。
   元に戻すは、データと月を戻したあと、開いているシートを閉じる（「入力をやめました」の元に戻すは closeSheet 側の別の経路）。
   opt.defer: トーストをすぐ出さず S.deferredToast に置く（精算から開いた S-15 の途中。最後の1件のあとに s15Next が出す） */
function commit(fn, opt = {}) {
  const before = { data: clone(S.data), month: { ...S.month } };
  const text = fn();
  const undo = () => { S.data = before.data; S.month = before.month; S.highlight = null; S.sheet = null; S.deferredToast = null; render(); };
  if (opt.defer) S.deferredToast = { text, undo };
  else showToast(text, undo);
}
/* シートを開く。出ていたトーストは消す（§3.7） */
function openSheet(sh) { hideToast(); S.sheetEnter = !S.sheet; S.sheet = sh; render(); }
/* シートを閉じる（下へのスワイプ・背景のタップ・つまみ）。入力があれば「入力をやめました　元に戻す」（押すと入力のまま開き直す）。
   精算から開いた S-15 を途中で閉じたときは、それまでの最後の操作のトーストを1つ出す（入れた分は保存済み）。
   閉じた行に入力があったときは「入力をやめました」を優先する（トーストは一度に1つ。§3.7） */
function closeSheet(byUser) {
  const sh = S.sheet; if (!sh) return;
  const dt = S.deferredToast; S.sheet = null; S.deferredToast = null;
  if (byUser && sh.dirty) showToast('入力をやめました', () => { S.sheet = sh; S.sheetEnter = true; render(); });
  else if (dt) showToast(dt.text, dt.undo);
  render();
}
function sheetErr(t, kind = 'err', extra = {}) {
  S.sheet.err = { t, kind, ...extra };
  if (t === '金額を入れてください') S.sheet.shake = true;
  render();
}
/* S-20 のその場の1行。at = 押した場所（main: 主ボタン、a・b: そのカードのチェック、redo: 精算をやり直す、status: 押したボタンが消えたとき） */
function s20Msg(t, kind = 'info', at = 'main') { S.s20msg = { m: S.month.S20, t, kind, at }; render(); }
/* S-10 を離れたら「新着」を消す（最後に見た時刻を今にする） */
function markSeen() { if (S.route === 'tab' && S.tab === 'S-10') S.data.people[S.viewer].lastSeen = S.now; }
const freshLogin = () => ({ id: '', pw: '', show: false, err: null, state: 'normal' });

/* --- 共通: タブ・月切替・シート・トースト --- */
/* 精算タブをもう一度押す・ほかのタブへ移る・月を切り替えると「この月を精算する」のモードは消える（画面の状態だけ。§4 S-20） */
ACT.tab = (t) => { if (t !== S.tab || S.sub) markSeen(); S.tab = t; S.sub = null; S.calcOpen = false; S.fixedOpen = false; S.settleNow = null; render(); };
ACT.monthStep = (arg) => { const [k, dlt] = arg.split(':'); S.month[k] = CALC.addMonth(S.month[k], +dlt); S.calcOpen = false; S.fixedOpen = false; S.settleNow = null; render(); };
/* S-04 月を選ぶ（§3.4）: 上部バーの年月から開く。年はシートの中の状態（開いたときは見ている月の年）。
   マスを押すと、開いたタブ（S10 ／ S20）の月を変えてシートを閉じる */
const s04Sheet = (k) => ({ id: 'S-04', tab: k, year: +S.month[k].slice(0, 4) });
ACT.openS04 = (k) => openSheet(s04Sheet(k));
ACT.s04Year = (d) => { S.sheet.year += +d; render(); };
ACT.pickMonth = (m) => { S.month[S.sheet.tab] = m; S.calcOpen = false; S.fixedOpen = false; S.settleNow = null; closeSheet(); };
ACT.goSettle = (m) => { markSeen(); S.tab = 'S-20'; S.month.S20 = m; S.calcOpen = false; S.settleNow = null; render(); };
ACT.openSettleFrom = (m) => { dropSheet(); markSeen(); S.tab = 'S-20'; S.month.S20 = m; S.calcOpen = false; S.settleNow = null; render(); };
ACT.toggleFixed = () => { S.fixedOpen = !S.fixedOpen; render(); };
/* 計算を見る: 開いたら、式の最後の行（手取りを変えるがあればそれ）が固定部分とタブバーの上に見えるところまでページを送る
   （375×548 では送らないと1行も見えないため。§7.5）。閉じるときは送らない */
ACT.toggleCalc = () => {
  S.calcOpen = !S.calcOpen; render();
  if (!S.calcOpen) return;
  requestAnimationFrame(() => {
    const page = $('#page'), calc = $('#page .calc'); if (!calc) return;
    const foot = $('#page .s20-foot'), bar = $('#tabbar');
    const limit = foot ? foot.getBoundingClientRect().top : bar && !bar.hidden ? bar.getBoundingClientRect().top : page.getBoundingClientRect().bottom;
    const dy = Math.ceil(calc.getBoundingClientRect().bottom - limit + 8);
    let reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* 無くてもよい */ }
    if (dy > 0) page.scrollBy({ top: dy, behavior: reduce ? 'auto' : 'smooth' });
  });
};
ACT.backdrop = () => closeSheet(true);
/* つまみ・［わかった］: 背景のタップと同じ（入力があれば「入力をやめました」） */
ACT.closeSheet = () => closeSheet(true);
ACT.undo = () => { const u = S.toast && S.toast.undo; hideToast(); if (u) u(); else render(); };

/* --- S-01・S-02・S-03 --- */
/* 文字の欄に入力したら、その場の1行を消す（§4.0.3）。IME の入力を壊さないよう描き直さず、1行（data-errline）と赤い枠・aria-invalid を
   DOM から外し、状態の err を null にする。その場の1行は一度に1つなので、欄に結びつかない1行も一緒に消す。st = 消したあとの状態キー */
function clearTypedErr(o, el, st) {
  if (!o || !o.err) return false;
  o.err = null;
  const scope = el.closest('.sh-root, form');
  if (!scope) return true;
  scope.querySelectorAll('[data-errline]').forEach((x) => x.remove());
  scope.querySelectorAll('.bad').forEach((x) => x.classList.remove('bad'));
  scope.querySelectorAll('[aria-invalid]').forEach((x) => { x.removeAttribute('aria-invalid'); x.removeAttribute('aria-describedby'); });
  const root = el.closest('[data-screen]'); if (root && st) root.dataset.state = st;
  return true;
}
INPUT.loginId = (v, el) => { S.login.id = v; clearTypedErr(S.login, el, 'normal'); };
INPUT.loginPw = (v, el) => { S.login.pw = v; clearTypedErr(S.login, el, 'normal'); };
ACT.loginEye = () => { S.login.show = !S.login.show; render(); const f = $('#login-pw'); if (f) f.focus(); };
ACT.login = () => {
  const L = S.login;
  if (!L.id.trim()) { L.err = 'id'; return render(); }
  if (!L.pw) { L.err = 'pw'; return render(); }
  const p = Object.keys(S.data.people).find((k) => S.data.people[k].id === L.id.trim());
  if (!p || L.pw === 'wrong') { L.err = 'fail'; return render(); }
  L.err = null; L.state = 'done'; render();
  setTimeout(() => {
    S.viewer = p; S.auth = 'in'; S.login = freshLogin(); resetView();
    if (!S.onboarded[p]) { S.route = 'S-02'; S.onboard = { name: S.data.people[p].name, err: null }; }
    render();
  }, 700);
};
INPUT.onbName = (v, el) => { S.onboard.name = v; clearTypedErr(S.onboard, el, 'normal'); const av = $('#s02-av'); if (av) av.textContent = [...v][0] || ''; };
ACT.start = () => {
  const O = S.onboard, n = O.name.trim();
  if (!n) { O.err = '呼び名を入れてください'; return render(); }
  if (charLen(n) > 6) { O.err = '呼び名は6文字までです'; return render(); }
  S.data.people[S.viewer].name = n; S.onboarded[S.viewer] = true; O.err = null;
  S.route = 'tab'; S.tab = 'S-11';
  /* 初日テスト（§10.2）は S-02 から始める。課題1の時間とタップ数は S-02 のあとから測る */
  if (S.firstDay && S.firstDay.running) { S.firstDay.mark = Date.now(); S.firstDay.taps = 0; }
  render();
};
ACT.openS03 = () => openSheet({ id: 'S-03' });

/* --- S-11・S-12 記録の追加（フロー a） --- */
const newRecordDraft = (cat) => ({
  id: 'S-12', cat, amount: '', memo: '', memoMode: false,
  dateSel: 'today', otherDate: null,
  /* 払った人の既定は、設定（S-30）で本人が決めた固定の値（P5）。'self' → ログイン中の人、'joint' → 共用。
     S-14・S-15・S-32 はこの設定を見ない（それぞれ記録の値・ひな形の値のまま） */
  payer: S.data.people[S.viewer].defaultPayer === 'joint' ? 'joint' : S.viewer,
  err: null, dirty: false, replaced: true,
});
/* 記録タブを開く（＋ 記録 は無くなったので、ハッシュ・画面へジャンプの入口として残す） */
ACT.newRecord = () => { dropSheet(); S.tab = 'S-11'; S.sub = null; render(); };
ACT.pickCat = (key) => openSheet(newRecordDraft(key));
/* S-12 の戻る（＜）: シートを閉じて記録タブのカテゴリ一覧に戻る（入力があれば「入力をやめました　元に戻す」。§3.7） */
ACT.backToGrid = () => { S.tab = 'S-11'; S.sub = null; closeSheet(true); };
ACT.memo = () => { S.sheet.memoMode = true; S.sheet.focus = 'rec-memo'; render(); };
INPUT.memo = (v) => { S.sheet.memo = v; S.sheet.dirty = true; };
/* キーボードを閉じたらテンキーに戻る（押したボタンの click を妨げないよう少し遅らせる） */
BLUR.memoDone = () => {
  const sh = S.sheet; if (!sh || !sh.memoMode) return;
  sh.memoMode = false;
  const rc = S.renderCount;
  setTimeout(() => { if (S.renderCount === rc && S.sheet === sh) render(); }, 200);
};
ACT.setDate = (v) => { const sh = S.sheet; sh.dateSel = v; sh.dirty = true; sh.err = null; render(); };
ACT.pickDate = () => { const inp = $('#rec-date'); if (!inp) return; try { inp.showPicker(); } catch (e) { inp.focus(); } };
CHANGE.otherDate = (v) => {
  const sh = S.sheet; if (!sh || !v) return;
  const t = today();
  sh.otherDate = v; sh.dateSel = v === t ? 'today' : v === addDays(t, -1) ? 'yesterday' : 'other';
  sh.dirty = true; sh.err = null; render();
};
ACT.setPayer = (w) => { S.sheet.payer = w; S.sheet.dirty = true; render(); };
/* テンキー（直すとき S-14・S-21 は最初のキーで置き換える。7桁まで）。S-21 の手取りは 0 を入れられる（先頭の 0 は1つ残す。空の欄で「0」「00」→ 0）。
   キーを押したら、その場の1行は種類に関係なく消す（§4.0.3） */
const digitsOf = (s, isNet) => s.replace(isNet ? /^0+(?=\d)/ : /^0+/, '');
function keyInput(k) {
  const sh = S.sheet; if (!sh) return;
  const isNet = sh.id === 'S-21';
  const cur = isNet ? sh.net[sh.target] : sh.amount;
  const replace = isNet ? !sh.replaced[sh.target] : !sh.replaced;
  let s;
  if (k === 'bs') s = replace ? '' : cur.slice(0, -1);
  else {
    s = digitsOf((replace ? '' : cur) + k, isNet);
    if (s.length > 7) { sh.shake = true; render(); return; }
  }
  if (isNet) { sh.net[sh.target] = s; sh.replaced[sh.target] = true; } else { sh.amount = s; sh.replaced = true; }
  sh.dirty = true;
  sh.err = null;
  render();
  announceAmount(sh);
}
/* 入力のたびに #live の中身だけを変える（S-12・S-14・S-15 は「金額 1,280円」、S-21 は「まさとの手取り 300,000円」） */
function announceAmount(sh) {
  if (sh.id === 'S-21') { const n = sh.net[sh.target]; announce(`${whoName(sh.target)}の手取り ${n === '' ? '未入力' : fmt(Number(n)) + '円'}`); }
  else announce(`金額 ${fmt(Number(sh.amount || 0))}円`);
}
ACT.key = (k) => keyInput(k);
/* 貼り付けた金額の判定（§7.5 テンキー・S-32 の金額の欄）: 全角の数字・記号を半角にし、数字と桁区切り（前に ¥、後ろに 円 は可）だけのときに
   カンマを除いた数字を返す。7桁を超える値、小数点・日付・ほかの文字を含む値は null（切り詰めない） */
function parsePastedAmount(str) {
  const t = String(str == null ? '' : str).replace(/[\uFF01-\uFF5E]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
  if (!/^[¥￥\s]*[0-9][0-9,，]*\s*円?\s*$/.test(t)) return null;
  const n = t.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
  return n.length > 7 ? null : n;
}
function pasteDigits(str) {
  const sh = S.sheet, isNet = sh.id === 'S-21';
  const p = parsePastedAmount(str);
  if (p == null) { sh.shake = true; render(); return; }   /* 受け付けない値は、値を変えずに金額を揺らす */
  const s = digitsOf(p, isNet);   /* S-21 は '0' を受け付ける */
  if (!s) return;
  if (isNet) { sh.net[sh.target] = s; sh.replaced[sh.target] = true; } else { sh.amount = s; sh.replaced = true; }
  sh.dirty = true; sh.err = null; render(); announceAmount(sh);
}

/* 給料の入り先（S-33）。本人だけが変えられる（§2.2）ので、相手の行では読み取り専用にしてこの操作を置かない。
   押したときは下書き（シート）を変えるだけで、［保存］で保存する（§1.3・§1.4。呼び名・色・出す割合と同じ）。
   トースト「給料の入り先を『共用口座』にしました　元に戻す」は保存したときに出す（「元に戻す」は commit の巻き戻しに乗る）。
   オフラインのときは切り替えない（S-33 のほかの操作と同じく「オンラインで直せます」を固定部分の直上に出す） */
ACT.s33Salary = (v) => {
  const sh = S.sheet;
  if (sh.p !== S.viewer) return;
  if (S.offline) return sheetErr('オンラインで直せます', 'info');
  S.sheet.salaryToJoint = (v === 'joint'); S.sheet.dirty = true; render();
};
ACT.s33Save = () => {
  const sh = S.sheet, self = sh.p === S.viewer;
  if (S.offline) return sheetErr('オンラインで直せます', 'info');
  const name = sh.name.trim();
  if (!name) return sheetErr('呼び名を入れてください', 'err', { field: 'name' });
  if (charLen(name) > 6) return sheetErr('呼び名は6文字までです', 'err', { field: 'name' });
  /* 出す割合は本人の行でだけ直せる（相手の行は読み取り専用。欄も無い） */
  const r = sh.rate.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
  if (self && (!/^\d{1,3}$/.test(r) || +r > 100)) return sheetErr('0〜100で入れてください', 'err', { field: 'rate' });
  commit(() => {
    const d = S.data, me = d.people[sh.p], ot = d.people[other(sh.p)];
    me.name = name; if (self) me.ratePct = +r;
    /* 給料の入り先も本人の行でだけ保存する。変わったときはトーストでそれを知らせる（§1.4） */
    const changed = !!me.salaryToJoint !== !!sh.salaryToJoint;
    if (self) me.salaryToJoint = !!sh.salaryToJoint;
    if (me.color !== sh.color) { ot.color = me.color; me.color = sh.color; }   /* 片方を選ぶと相手は残りの色 */
    return changed ? `給料の入り先を『${sh.salaryToJoint ? '共用口座' : '自分の口座'}』にしました` : '保存しました';
  });
  dropSheet(); render();
};
ACT.openS34 = () => openSheet({ id: 'S-34', pw: '', show: false, err: null, dirty: false, focus: 'new-pw' });
INPUT.newPw = (v, el) => { S.sheet.pw = v; S.sheet.dirty = true; clearTypedErr(S.sheet, el, 'normal'); };
ACT.s34Eye = () => { S.sheet.show = !S.sheet.show; S.sheet.focus = 'new-pw'; render(); };
ACT.s34Save = () => {
  const sh = S.sheet;
  if (S.offline) return sheetErr('オンラインで直せます', 'info');
  if (sh.pw.length < 8) return sheetErr('8文字以上にしてください', 'err', { field: 'pw' });   /* 欄の下に出す */
  dropSheet(); showToast('パスワードを変えました', null); render();   /* 元に戻すは無し */
};
ACT.logout = () => { S.auth = 'out'; dropSheet(); hideToast(); S.login = freshLogin(); render(); };

/* §3.6 オフライン: つながったら保留した記録を自動で送る。月が精算中になっていたら「送れませんでした」 */
function setOffline(on) {
  S.offline = on;
  if (!on) {
    S.s30msg = null;   /* オンラインに戻ったら S-30 のその場の1行は消す（§3.6） */
    for (const e of S.data.expenses) if (e.sync === 'pending') e.sync = isLocked(e.month) ? 'failed' : null;
  }
  render();
}
