/* 検算パネル: §9.6 の V1〜V10（見本データから）＋ いまのデータで式が成り立つか */
function liveChecks() {
  return CALC.monthsUntil(S.data, S.now).map((m) => {
    const mo = CALC.settleModel(S.data, m, S.now), s = mo.sum;
    const ok = s.total === s.adv.a + s.adv.b + s.joint
      && s.byCat.reduce((a, x) => a + x.amount, 0) === s.total
      && s.fixedSum === s.fixedRows.filter(CALC.isCounted).reduce((a, e) => a + e.amount, 0)
      && (!mo.decided || (mo.jointNet === mo.settle.a + mo.settle.b + mo.jointSalary.a + mo.jointSalary.b - mo.joint
        && mo.jointBook === mo.jointNet + mo.salaryLeft
        && mo.jointBook === mo.salaryIn.a + mo.salaryIn.b + Math.max(mo.settle.a, 0) + Math.max(mo.settle.b, 0) - mo.joint - Math.max(-mo.settle.a, 0) - Math.max(-mo.settle.b, 0)
        && mo.remaining.a === mo.settle.a - mo.transferred.a && mo.remaining.b === mo.settle.b - mo.transferred.b));
    const dir = (n) => (n > 0 ? `入れる ${fmt(n)}` : n < 0 ? `受け取る ${fmt(n)}` : '0');
    const detail = `支出 ${fmt(mo.total)}` + (mo.decided ? ` ／ まさと ${dir(mo.remaining.a)} ／ りさこ ${dir(mo.remaining.b)} ／ 共用 ${mo.jointBook < 0 ? '出る' : '残る'} ${fmt(mo.jointBook)}${mo.salaryLeft ? `（うち 給料の残り ${fmt(mo.salaryLeft)}）` : ''}` : ' ／ 出す額 未定');
    return { m, ok, detail };
  });
}
/* 検査の重ね表示: §0.5 の上限と実測（操作グループ・塗りの青・大きな金額・入力欄・B9） */
function updateInspect() {
  const box = $('#inspect'), dev = $('#device');
  box.hidden = !S.inspect;
  if (!S.inspect) { dev.classList.remove('over'); return; }
  const root = S.sheet ? $('#sheet .sh-root') : $('#page .screen');
  if (!root) return;
  const scr = root.dataset.screen, st = root.dataset.state;
  const vis = (el) => el.getClientRects().length > 0;
  const groups = new Set([...root.querySelectorAll('[data-g]')].filter(vis).map((e) => e.dataset.g));
  let blue = [...root.querySelectorAll('.btn-fill')].filter(vis).length;
  const big = [...root.querySelectorAll('[data-big]')].filter(vis).length;
  const inputs = [...root.querySelectorAll('input:not([type=date]):not([type=checkbox]), .netfield')].filter(vis).length;
  /* S-33 は相手の行でも呼び名が空なら data-state が action になるので、画面IDだけでは自分の行の上限（5・入力欄2）を引いてしまう。
     相手の行（出す割合と給料の入り先が読み取り専用。§2.2）は状態によらず 'S-33:partner' を先に引く */
  const key = (scr === 'S-33' && S.sheet && S.sheet.p !== S.viewer) ? 'S-33:partner' : scr + ':' + st;
  const L = LIMITS[key] || LIMITS[scr] || { blue: 1, gMax: 7, gDesign: '—', big: 0, inp: 0 };
  const blueMax = scr === 'S-31' && st !== 'empty' ? 0 : L.blue;
  /* B9（§0.4）: 下端に固定した部分の裏に隠れた中身が無いか。対象は LIMITS で b9 が付いた画面だけ。
     シート = 中身がはみ出してスクロールが要るか（scrollHeight − clientHeight）と、固定部分（.sh-foot）の裏に中身が入っていないか
     （.sh-foot より前にある見えている最後の要素の下端 − .sh-foot の上端。正なら隠れている）の大きい方。
     S-20 = 共用の行（.jline）と見込みの注記の下端が固定部分（.s20-foot）の上端より下（該当するものをすべて測る）。
     S-10・S-20 = 最初の [data-big] の上端が上から 200px を超える（オフラインの行の分は除く）。
     S-11 = グリッドの上端（200px）と、グリッドの下端がタブバーに隠れないか・スクロールが要らないか */
  const devTop = dev.getBoundingClientRect().top;
  let b9 = null;
  if (L.b9) {
    b9 = 0;
    if (S.sheet) {
      const sh = $('#sheet'); b9 = Math.max(0, sh.scrollHeight - sh.clientHeight);
      const ft = root.querySelector(':scope > .sh-foot');
      if (ft) {
        let prev = ft.previousElementSibling;
        while (prev && !vis(prev)) prev = prev.previousElementSibling;
        if (prev) b9 = Math.max(b9, Math.round(prev.getBoundingClientRect().bottom - ft.getBoundingClientRect().top));
      }
    } else {
      if (scr === 'S-20') {
        /* 共用の行と、見込みの注記（金額待ち n件を含みません）は固定部分に隠れない。「計算を見る」は裏に入ってよい（§4 S-20）。
           注記「うち 給料の残り ◯円」（.jline-sub）は B9 の対象に入れない（§0.4 B9） */
        const ft = root.querySelector('.s20-foot');
        if (ft) for (const sel of ['.jline', ':scope > .note:not(.jline-sub)']) {
          for (const el of root.querySelectorAll(sel)) if (vis(el)) b9 = Math.max(b9, Math.round(el.getBoundingClientRect().bottom - ft.getBoundingClientRect().top));
        }
      }
      if (scr === 'S-20' || scr === 'S-10') {
        const bg = [...root.querySelectorAll('[data-big]')].filter(vis)[0];
        const off = root.querySelector('.offline'); const offH = off && vis(off) ? off.getBoundingClientRect().height : 0;
        if (bg) b9 = Math.max(b9, Math.round(bg.getBoundingClientRect().top - devTop - offH - 200));
      }
      if (scr === 'S-11') { const g = root.querySelector('.grid'); if (g) { const off = root.querySelector('.offline'); const offH = off && vis(off) ? off.getBoundingClientRect().height : 0; const r = g.getBoundingClientRect(); b9 = Math.max(b9, Math.round(r.top - devTop - offH - 200), Math.round(r.bottom - $('#tabbar').getBoundingClientRect().top), Math.max(0, $('#page').scrollHeight - $('#page').clientHeight)); } }
    }
  }
  const rows = [
    ['画面・状態', `${scr}:${st}`, false],
    ['操作グループ', `${groups.size} / 上限 ${L.gMax}（設計 ${L.gDesign}）`, groups.size > L.gMax],
    ['塗りの青', `${blue} / 上限 ${blueMax}`, blue > blueMax],
    ['大きな金額', `${big}（設計 ${L.big}・上限 3）`, big > 3],
    ['入力欄', `${inputs}（設計 ${L.inp}・上限 2）`, inputs > 2],
    ['B9 隠れ', b9 == null ? '—（対象外）' : b9 > 0 ? `あり（${b9}px）` : 'なし', !!(b9 > 0 && S.dev === '375x548')],
    /* S-30 は B9 の対象外（§0.4）。縦の寸法を見るためにスクロール量だけ出す。第3要素は always false＝赤枠・over には入れない */
    ...(scr === 'S-30' ? [['スクロール', (() => { const p = $('#page'); const v = Math.max(0, p.scrollHeight - p.clientHeight); return v ? `あり（${v}px）` : 'なし'; })(), false]] : []),
  ];
  box.innerHTML = `<strong>検査の重ね表示</strong><table>${rows.map(([k, v, ng]) => `<tr><td>${k}</td><td class="${ng ? 'ng' : 'ok'}">${esc(v)}</td></tr>`).join('')}</table>
    <p class="mk-sub" style="margin-top:6px">グループ: ${[...groups].join('・') || '—'}</p>`;
  dev.classList.toggle('over', rows.some((r) => r[2]));
}
/* URL のハッシュ（キー・読む順・例は mock/README.md の「URL のハッシュ」。仕様書 §10.1）: s・st（画面ID・状態キー。読むときは s が S-01・S-02 のときだけ使う）、v（閲覧者）、sc（シナリオ）、d（端末の大きさ）、case（精算ケース）、
   tab（S-11／S-10／S-20／S-30／S-31）、m（そのタブで見ている月）、sh（開いているシート）、sa（シートの主な引数）、
   j（画面へジャンプで来て、そのあと操作していないときのジャンプのキー） */
function sheetArg(sh) {
  switch (sh.id) {
    case 'S-14': return sh.rowId;
    case 'S-15': return sh.queue[sh.idx];   /* いま出している行（残りの先頭） */
    case 'S-22': case 'S-33': return sh.p;
    case 'S-32': return sh.tplId || '';
    case 'S-04': return String(sh.year);    /* シートに出している年（タブは tab、いま見ている月は m で決まる） */
    case 'S-13': case 'S-21': return sh.m;
    case 'S-12': return sh.cat;
    default: return '';
  }
}
function updateHash() {
  const root = S.sheet ? $('#sheet .sh-root') : $('#page .screen');
  if (!root) return;
  const q = new URLSearchParams({ s: root.dataset.screen, st: root.dataset.state, v: S.viewer, sc: S.scenario, d: S.dev });
  if (S.caseId) q.set('case', S.caseId);
  if (S.auth === 'in' && S.route === 'tab') {
    const tab = S.tab === 'S-30' && S.sub === 'S-31' ? 'S-31' : S.tab;
    q.set('tab', tab);
    if (tab === 'S-10') q.set('m', S.month.S10); else if (tab === 'S-20') q.set('m', S.month.S20);
  }
  if (S.sheet) { q.set('sh', S.sheet.id); const a = sheetArg(S.sheet); if (a) q.set('sa', a); }
  if (S.jump) q.set('j', S.jump);
  try { history.replaceState(null, '', '#' + q.toString()); } catch (e) { /* 埋め込み先で使えなくてもよい */ }
}
/* ハッシュから同じ画面・同じデータを作る。順: d → case（無ければ sc）→ v → j（シナリオが sc と同じなら実行して終わる）
   → s が S-01（ログイン前）・S-02（閲覧者 v の初回）ならそれを置いて終わる → tab・m・sh（閉じた月では S-21 を開かない） */
function applyHash() {
  let q; try { q = new URLSearchParams(location.hash.slice(1)); } catch (e) { return; }
  if (DEVICES.some((d) => d[0] === q.get('d'))) S.dev = q.get('d');
  const cs = q.get('case'), sc = q.get('sc');
  if (CASES.some((c) => c.id === cs)) applyCase(cs);
  else if (SCENARIOS.some((x) => x.id === sc)) loadScenario(sc);
  if (q.get('v') === 'a' || q.get('v') === 'b') S.viewer = q.get('v');
  const j = JUMPS.find((x) => x[0] === q.get('j'));
  if (j && !cs && j[2].sc === sc) { j[2](); S.jump = j[0]; return; }
  if (q.get('s') === 'S-01') { S.auth = 'out'; S.login = freshLogin(); return; }
  /* S-02 は閲覧者 v の初回として置く */
  if (q.get('s') === 'S-02') { S.auth = 'in'; S.route = 'S-02'; S.onboarded[S.viewer] = false; S.onboard = { name: S.data.people[S.viewer].name, err: null }; return; }
  const tab = q.get('tab');
  if (['S-11', 'S-10', 'S-20', 'S-30', 'S-31'].includes(tab)) { S.tab = tab === 'S-31' ? 'S-30' : tab; S.sub = tab === 'S-31' ? 'S-31' : null; }
  const months = CALC.monthsUntil(S.data, S.now), m = q.get('m');
  if (months.includes(m)) { if (S.tab === 'S-10') S.month.S10 = m; else if (S.tab === 'S-20') S.month.S20 = m; }
  const sa = q.get('sa') || '';
  const open = {
    'S-03': () => ACT.openS03(),
    /* 月を選ぶ: 上部バーの年月から開くので、tab が支出か精算のときだけ。sa はシートに出す年（範囲の外・空なら見ている月の年） */
    'S-04': () => {
      if (S.tab !== 'S-10' && S.tab !== 'S-20') return;
      const k = S.tab === 'S-10' ? 'S10' : 'S20';
      ACT.openS04(k);
      const y = +sa, y0 = +S.data.household.createdMonth.slice(0, 4), y1 = +curMonth().slice(0, 4);
      if (/^\d{4}$/.test(sa) && y >= y0 && y <= y1) S.sheet.year = y;
    },
    'S-11': () => ACT.newRecord(),                                        /* 古いハッシュ（S-11 がシートだったころ）は記録タブへ */
    'S-12': () => { ACT.newRecord(); if (catOf(sa)) ACT.pickCat(sa); },
    'S-13': () => { if (months.includes(sa)) S.month.S10 = sa; ACT.openS13(); },
    'S-14': () => ACT.openRow(sa),
    'S-15': () => {
      /* 精算タブで、その月の S-20 が prep なら、精算から開いた形（1 / n と［次へ］）でその行の位置から */
      const mo = CALC.settleModel(S.data, S.month.S20, S.now);
      if (S.tab === 'S-20' && CALC.s20State(S.data, mo, S.settleNow) === 'prep') { const qu = prepQueue(mo); openSheet(prepSheet(mo, Math.max(0, qu.indexOf(sa)))); }
      else if (MODEL.find(S.data, sa)) ACT.openPending(sa);
    },
    'S-21': () => { if (months.includes(sa)) S.month.S20 = sa; if (!isLocked(S.month.S20)) ACT.openS21(); },   /* 閉じた月（精算中・精算済み）では開かない */
    /* S-22 は、精算タブで S-20 がカードを出す状態（estimate・ready・transfer・settled・redo）のときだけ */
    'S-22': () => { if ((sa === 'a' || sa === 'b') && S.tab === 'S-20' && S22_STATES.includes(CALC.s20State(S.data, CALC.settleModel(S.data, S.month.S20, S.now), S.settleNow))) ACT.openS22(sa); },
    'S-32': () => ACT.openS32(S.data.templates.some((t) => t.id === sa) ? sa : undefined),
    'S-33': () => { if (sa === 'a' || sa === 'b') ACT.openS33(sa); },
    'S-34': () => ACT.openS34(),
  }[q.get('sh')];
  if (open) open();
}
function updateMock() {
  const p = $('#mockPanel'); if (!p.innerHTML) return;
  p.classList.toggle('open', S.mockOpen);
  $('#mockPill').setAttribute('aria-expanded', String(S.mockOpen));
  p.querySelectorAll('[data-mk="viewer"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.viewer)));
  $('#mk-scenario').value = S.scenario; $('#mk-case').value = S.caseId; $('#mk-dev').value = S.dev;
  $('#mk-offline').checked = S.offline; $('#mk-safari').checked = S.safari; $('#mk-inspect').checked = S.inspect; $('#mk-toast').checked = S.toastLong;
  const c = CASES.find((x) => x.id === S.caseId);
  $('#mk-now').textContent = `今日: ${md(S.now)}（${wd(S.now.slice(0, 10))}）${hm(S.now)}　` + (c && !c.real ? `精算ケース ${c.id} の合成の数字を表示中` : '');
  $('#mk-months').innerHTML = CALC.monthsUntil(S.data, S.now).map((m) => `<button type="button" class="mk-btn" data-mk="month" data-m="${m}" aria-pressed="${(S.tab === 'S-20' ? S.month.S20 : S.month.S10) === m}">${mShort(m)}（${{ open: '進行中', closing: '締め待ち', confirmed: '精算中', settled: '精算済み' }[statusOf(m)]}）</button>`).join('');
  $('#mk-flow').textContent = S.flowText || 'ボタンで出発点を用意し、手順をここに出します。';
  const f = S.firstDay;
  const ansOpen = !!$('#mk-fd details[open]');   /* 描き直しても「期待する答え」の開閉を保つ */
  $('#mk-fd').innerHTML = !f
    ? `<p class="mk-sub">パートナー視点・説明なしで6課題。課題ごとの時間とタップ数（端末の中のタップ）を記録します。</p><button type="button" class="mk-btn" data-mk="fdStart">開始</button>`
    : `<p class="mk-sub" style="margin-bottom:6px">このモックの今日: ${md(S.now)}（${wd(S.now.slice(0, 10))}）${fdTask6Day() !== S.now.slice(0, 10) ? `（課題6は ${md(fdTask6Day())}）` : ''}</p>
      <ul class="mk-v mk-fd">${FD_TASKS.map((t, i) => {
        const r = f.results[i];
        /* 課題1は30秒を超えたら ✓ にしない */
        const mark = !r ? (f.running && i === f.results.length ? `<button type="button" class="mk-btn" data-mk="fdDone">できた</button>` : '')
          : i === 0 && r.ms > FD_LIMIT_MS ? '<span class="ng">30秒を超えた</span>' : '<span class="ok">✓</span>';
        return `<li><span>${i + 1}. ${esc(t.q)}${r ? `<small>${(r.ms / 1000).toFixed(1)}秒・${r.taps}タップ</small>` : ''}${t.a ? `<details><summary>期待する答え</summary>${esc(t.a)}</details>` : ''}</span>${mark}</li>`;
      }).join('')}</ul>
      <p class="mk-sub" style="margin-top:4px">課題5を終えると、課題6の準備（精算中の月にする）を自動で行います。</p>
      <div class="mk-row" style="margin-top:6px">${f.running ? `<button type="button" class="mk-btn" data-mk="fdEnd">終了</button>` : `<button type="button" class="mk-btn" data-mk="fdStart">もう一度</button>`}</div>`;
  if (ansOpen) { const dt = $('#mk-fd details'); if (dt) dt.open = true; }
  const live = liveChecks();
  const allOk = VERIFY_RESULT.every((r) => r.ok) && live.every((r) => r.ok);
  $('#mk-vsum').textContent = `検算 ${VERIFY_RESULT.filter((r) => r.ok).length}/${VERIFY_RESULT.length} ${VERIFY_RESULT.every((r) => r.ok) ? '✓' : '✗'}　いまのデータ ${live.every((r) => r.ok) ? '✓' : '✗'}`;
  $('#mk-vsum').style.color = allOk ? 'var(--mock-ok)' : 'var(--mock-ng)';
  $('#mk-verify').innerHTML = `<ul class="mk-v">${VERIFY_RESULT.map((r) => `<li><span class="${r.ok ? 'ok' : 'ng'}">${r.ok ? '✓' : '✗'}</span><span>${r.id} ${esc(r.label)}<small>${esc(r.detail)}</small></span></li>`).join('')}</ul>
    <p class="mk-sub" style="margin:8px 0 4px">いまのデータ（操作したあとも V1・V4・V6・V8・V9 が成り立つか）</p>
    <ul class="mk-v">${live.map((r) => `<li><span class="${r.ok ? 'ok' : 'ng'}">${r.ok ? '✓' : '✗'}</span><span>${mLabel(r.m)}<small>${esc(r.detail)}</small></span></li>`).join('')}</ul>`;
  updateInspect();
  updateHash();
}

/* ---------------------------------------------------------------------
   11. 起動とイベントの結びつけ
   --------------------------------------------------------------------- */
function bindEvents() {
  let gripDragged = false;   /* つまみを少しでも引いたあとの click は閉じる操作にしない（60px 未満なら元に戻るだけ） */
  document.addEventListener('click', (ev) => {
    const mk = ev.target.closest('[data-mk]');
    if (mk) { if (!['close', 'fdDone', 'fdEnd'].includes(mk.dataset.mk)) S.jump = ''; const fn = MOCK[mk.dataset.mk]; if (fn) fn(mk); return; }
    if (ev.target.id === 'rec-date') { try { ev.target.showPicker(); } catch (e) { /* ネイティブの動きに任せる */ } return; }
    const el = ev.target.closest('[data-act]');
    if (!el || !$('#app').contains(el)) return;
    if (el.hasAttribute('data-grip') && gripDragged) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    ev.preventDefault();
    S.jump = '';
    /* その場の1行は、次の操作で消す（§4.0.3・S-20・S-30）。保存の操作は、このあと sheetErr で付け直す */
    const act = el.dataset.act;
    if (act !== 'undo') { S.s20msg = null; S.s30msg = null; }
    if (S.sheet && S.sheet.err && act !== 'undo') S.sheet.err = null;
    fn(el.dataset.arg, el, ev);
  });
  document.addEventListener('submit', (ev) => { const f = ev.target.closest('[data-submit]'); if (f) { ev.preventDefault(); ACT[f.dataset.submit](); } });
  document.addEventListener('input', (ev) => { const k = ev.target.dataset && ev.target.dataset.in; if (k && INPUT[k] && S) { S.jump = ''; INPUT[k](ev.target.value, ev.target); updateHash(); } });
  document.addEventListener('change', (ev) => { const k = ev.target.dataset && ev.target.dataset.change; if (k && CHANGE[k]) { S.jump = ''; CHANGE[k](ev.target.value, ev.target); } });
  document.addEventListener('focusout', (ev) => { const k = ev.target.dataset && ev.target.dataset.blur; if (k && BLUR[k]) BLUR[k](ev.target.value, ev.target); });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && S.sheet) { S.jump = ''; closeSheet(true); return; }
    const t = ev.target;
    if (t.id === 'rec-memo' && ev.key === 'Enter') { ev.preventDefault(); t.blur(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.act) { ev.preventDefault(); t.click(); return; }
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (!S.sheet || !$('#sheet [data-keypad]')) return;
    if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); S.jump = ''; keyInput(ev.key); }
    else if (ev.key === 'Backspace') { ev.preventDefault(); S.jump = ''; keyInput('bs'); }
  });
  document.addEventListener('paste', (ev) => {
    if (!S.sheet || !$('#sheet [data-keypad]') || /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
    const txt = (ev.clipboardData && ev.clipboardData.getData('text')) || '';
    /* 数字と桁区切りだけの値を受け付ける。受け付けない値（7桁を超える・小数点・日付・文字）は金額を揺らす（pasteDigits） */
    if (txt.trim()) { ev.preventDefault(); S.jump = ''; pasteDigits(txt); }
  });
  /* シートのつまみを下へスワイプすると閉じる（背景のタップでも同じことができる。B13） */
  let drag = null;
  document.addEventListener('pointerdown', (ev) => {
    if (S.firstDay && S.firstDay.running && $('#device').contains(ev.target)) S.firstDay.taps++;
    if (ev.target.closest('[data-grip]')) { drag = { y: ev.clientY }; try { ev.target.setPointerCapture(ev.pointerId); } catch (e) { /* 無くてもよい */ } }
  });
  document.addEventListener('pointermove', (ev) => { if (drag) $('#sheet').style.transform = `translateY(${Math.max(0, ev.clientY - drag.y)}px)`; });
  document.addEventListener('pointerup', (ev) => {
    if (!drag) return;
    const dy = ev.clientY - drag.y; drag = null; $('#sheet').style.transform = '';
    if (Math.abs(dy) > 6) { gripDragged = true; setTimeout(() => { gripDragged = false; }, 0); }
    if (dy > 60) { S.jump = ''; closeSheet(true); }
  });
  $('#page').addEventListener('scroll', () => { const a = $('#page .appbar'); if (a) a.classList.toggle('scrolled', $('#page').scrollTop > 4); }, { passive: true });
  window.addEventListener('resize', () => { applyDevice(); updateInspect(); });
  /* 端末のキーボードを使うシート（S-12・S-14 のメモ、S-32、S-33、S-34）は visualViewport に合わせて位置を変え、
     最大の高さを「見えている高さ − 8px」に縮めてシートの中をスクロールできるようにする。フォーカスした欄を見える位置に出す（§4.0.3） */
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', () => {
      const el = $('#sheet'), sh = S.sheet;
      const kbd = !!sh && (['S-32', 'S-33', 'S-34'].includes(sh.id) || (['S-12', 'S-14'].includes(sh.id) && sh.memoMode));
      /* 見えている範囲の下端から #app の下端までの高さ（:root の下の余白〈safe-area〉があっても #app を基準にする） */
      const bottom = kbd && matchMedia('(max-width: 759px)').matches ? Math.max(0, Math.round($('#app').getBoundingClientRect().bottom - visualViewport.height - visualViewport.offsetTop)) : 0;
      /* 対象外のとき・キーボードが閉じたとき（bottom が 0）は元に戻す */
      if (!bottom) { el.style.bottom = ''; el.style.maxHeight = ''; return; }
      el.style.bottom = bottom + 'px';
      el.style.maxHeight = Math.max(200, visualViewport.height - 8) + 'px';
      /* 欄が下端の固定部分（主ボタン）の裏に入らないよう、その上端の 8px 上まで上げる */
      const a = document.activeElement;
      if (a && el.contains(a)) {
        a.scrollIntoView({ block: 'nearest' });
        const ft = el.querySelector('.sh-foot');
        const over = ft ? a.getBoundingClientRect().bottom + 8 - ft.getBoundingClientRect().top : 0;
        if (over > 0) el.scrollTop += over;
      }
    });
  }
}

function init() {
  try { const d = localStorage.getItem('kakeibo-dev'); if (DEVICES.some((x) => x[0] === d)) S.dev = d; } catch (e) { /* 使えなくてもよい */ }
  try { S.safari = !matchMedia('(display-mode: standalone)').matches; } catch (e) { S.safari = true; }
  VERIFY_RESULT = runVerification();
  loadScenario('sep-open');
  applyHash();
  buildMock();
  bindEvents();
  render();
}
if (typeof document !== 'undefined') init();
</script>
