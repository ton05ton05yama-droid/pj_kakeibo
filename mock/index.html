<style>
/* =====================================================================
   pj_kakeibo モック（UIの正本の片割れ。docs/03_ui_spec.md と画面ID・状態名・文言・見本データを一致させる）
   CSS の並び: 1 トークン（§7.1）→ 2 土台 → 3 モックの枠 → 4 アプリの部品（§7.5）→ 5 画面ごと → 6 モック操作（§10）
   ===================================================================== */

/* ===== 1. トークン（§7.1 そのまま + モック専用 --mock-*） =====
   ライトだけ（参考UI pj_income_visualization も forcedTheme='light' でライト固定。ダーク用の宣言とテーマ切替は置かない）。
   色の値は参考UIの theme.ts のパレットとセマンティックトークンにそろえる（zinc の灰色、アクセント blue.600）。
   アプリの地は白。まとまりの区別は罫線（border.default）と薄い面（bg.subtle・bg.muted）で行い、影は控えめにする */
:root {
  color-scheme: light;
  --font-sans: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --fs-xs: 11px; --fs-sm: 12px; --fs-body-sm: 13px; --fs-md: 14px; --fs-lg: 16px;
  --fs-xl: 18px; --fs-2xl: 20px; --fs-display: 24px; --fs-3xl: 28px; --fs-4xl: 32px; --fs-input: 16px;
  --lh-tight: 1.25; --lh-ui: 1.4; --lh-body: 1.6;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-10: 40px; --gutter: 16px;
  --tap-min: 44px; --control-h: 48px; --control-h-sm: 44px; --chip-h: 36px; --row-min-h: 56px;
  --appbar-h: 48px; --tabbar-h: 56px; --notice-h: 48px; --offline-h: 32px;
  --avatar: 28px; --avatar-sm: 20px; --avatar-lg: 56px; --icon: 20px; --icon-tab: 24px;
  --keypad-key-h: 48px; --keypad-gap: 4px; --grid-cell-h: 72px; --content-max-w: 480px;
  --sheet-max-h: 90dvh; --sheet-tall-max-h: calc(100dvh - max(24px, env(safe-area-inset-top, 0px) + 8px));
  --radius-tag: 4px; --radius-control: 10px; --radius-card: 12px; --radius-sheet: 16px; --radius-full: 9999px;
  --z-base: 0; --z-raised: 1; --z-sticky: 10; --z-overlay: 50; --z-sheet: 100; --z-toast: 150; --z-max: 999;
  --dur-fast: 120ms; --dur: 220ms; --ease-out: cubic-bezier(.2, .8, .2, 1);

  /* 背景（参考UI: 白・bg.subtle gray.50・bg.muted gray.100・bg.inverse gray.700・bg.primary blue.100） */
  --bg-page: #ffffff; --bg-surface: #ffffff; --bg-subtle: #fafafa; --bg-muted: #f4f4f5; --bg-input: #ffffff; --bg-inverse: #3f3f46;
  --bg-accent: #2563eb; --bg-accent-pressed: #173da6; --bg-accent-subtle: #dbeafe; --bg-accent-subtle-pressed: #bfdbfe;
  --bg-danger-subtle: #fef2f2; --bg-success-subtle: #f0fdf4; --backdrop: rgba(24, 24, 27, .36);
  /* 文字（参考UI: text.main gray.800・text.sub gray.600・text.muted gray.500・text.accent blue.600・text.accent.strong blue.700・text.danger.emphasis red.600） */
  --text-main: #27272a; --text-sub: #52525b; --text-muted: #71717a; --text-placeholder: #71717a; --text-disabled: #a1a1aa;
  --text-accent: #2563eb; --text-accent-strong: #173da6; --text-danger: #dc2626; --text-success: #116932; --text-warning: #92310a;
  --text-on-accent: #ffffff; --text-on-inverse: #fafafa; --text-inverse-action: #a3cfff;
  /* 罫線（参考UI: border.default gray.200・border.emphasis gray.300・border.accent blue.300） */
  --border: #e4e4e7; --border-strong: #d4d4d8; --border-accent: #a3cfff; --border-danger: #ef4444; --focus-ring: #3b82f6;
  --shadow-xs: 0 1px 2px rgba(24, 24, 27, .10), 0 0 1px rgba(24, 24, 27, .20);
  --shadow-sm: 0 2px 4px rgba(24, 24, 27, .10), 0 0 1px rgba(24, 24, 27, .30);
  --shadow-sheet: 0 -8px 24px rgba(24, 24, 27, .12), 0 0 1px rgba(24, 24, 27, .30);
  --shadow-toast: 0 8px 16px rgba(24, 24, 27, .16), 0 0 1px rgba(24, 24, 27, .30);
  /* 人の色（参考UIのパレット・CHART の定数から）: a = teal.600、b = amber（CHART_KPI_COLORS.generalCost）、共用 = gray.700。
     -fg は面に置く文字色（白地 4.5:1 以上: teal.700 #0c5d56 7.7、ranking.bronze #b45309 5.0）。-subtle は飾りだけ */
  --who-a: #0d9488; --who-a-on: #18181b; --who-a-fg: #0c5d56; --who-a-subtle: #ccfbf1;
  --who-b: #f59e0b; --who-b-on: #18181b; --who-b-fg: #b45309; --who-b-subtle: #fef9c3;
  --who-joint: #3f3f46; --who-joint-on: #ffffff; --who-joint-fg: #3f3f46; --who-joint-subtle: #e4e4e7;

  /* モック専用（アプリの外。§10 の操作パネル・端末の枠）。端末の外は参考UIの background.content。
     パネルも白を基本にし、黄色の破線の枠と「MOCK」のタグでアプリの画面と分ける */
  --mock-outer: #f5f7fa; --mock-outer-fg: #52525b; --mock-frame: #d4d4d8; --mock-bg: #ffffff; --mock-bg2: #fafafa; --mock-fg: #27272a;
  --mock-sub: #71717a; --mock-line: #d4d4d8; --mock-accent: #facc15; --mock-accent-on: #18181b; --mock-head: #845209; --mock-border: #ca8a04;
  --mock-ok: #116932; --mock-ng: #dc2626; --mock-alert: #dc2626; --mock-fold: #ca8a04;
  /* モックの枠・パネルの字体（アプリの --font-sans は §7.1 のまま。パネルには system-ui のフォールバックも付ける） */
  --mock-font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
}

/* ===== 2. 土台 ===== */
*, *::before, *::after { box-sizing: border-box; }
/* 公開の外枠（Artifact）と同じく、:root に上下の safe-area の余白を持つ（外枠と同じ値なので二重にならない）。
   アプリの中では env() を足さない（.app の --sa-top・--sa-bottom は 0。実装のアプリは §3.1 のとおり自分で足す） */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
html { font-family: var(--font-sans); font-size: 16px; -webkit-text-size-adjust: 100%; background: var(--bg-page); color: var(--text-main); }
/* 字体・文字の大きさ・背景は body にも明示する（外枠の body の規則〈14px・別の字体・別の背景〉より後に来るので、こちらが勝つ） */
body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: var(--lh-body); background: var(--bg-page); color: var(--text-main); -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; font-size: max(var(--fs-input), 1em); color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; text-align: inherit; }
p, h1, h2, h3 { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}

/* ===== 3. モックの枠（端末のカラム。アプリの外） ===== */
/* 入りきらない操作パネル・検査の重ね表示は、端末の下へ回る（safe center で左へはみ出さない） */
.shell { display: flex; flex-wrap: wrap; justify-content: center; justify-content: safe center; align-items: flex-start; gap: 24px; padding: 24px 16px 48px; min-height: 100%; background: var(--mock-outer); }
.dev-wrap { position: relative; flex: none; }
.device { position: relative; width: var(--dev-w, 375px); height: var(--dev-h, 667px); border-radius: 28px; overflow: hidden; background: var(--bg-page); border: 1px solid var(--mock-frame); box-shadow: 0 12px 40px rgba(24, 24, 27, .10); isolation: isolate; }
.device.over { outline: 3px solid var(--mock-alert); outline-offset: 4px; }
.fold { position: absolute; left: -52px; width: 44px; height: 0; border-top: 2px dashed var(--mock-fold); font: 600 11px/1 var(--mock-font); color: var(--mock-outer-fg); padding-top: 3px; text-align: right; pointer-events: none; }
.fold-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--mock-fold); z-index: var(--z-max); pointer-events: none; }
/* 端末の中では 100dvh の代わりに端末の高さを使う。左右の余白は safe-area を下回らない（§7.4）。
   上下の safe-area は :root の余白が持つので、アプリの中の --sa-top・--sa-bottom は 0（§10.1） */
.app { position: absolute; inset: 0; overflow: hidden; background: var(--bg-page); color: var(--text-main); font-family: var(--font-sans); font-size: var(--fs-lg); line-height: var(--lh-body);
  --sa-top: 0px; --sa-bottom: 0px;
  --sheet-max-h: calc(var(--dev-h, 667px) * .9); --sheet-tall-max-h: calc(var(--dev-h, 667px) - max(24px, var(--sa-top) + 8px));
  --pad-l: max(var(--gutter), env(safe-area-inset-left, 0px)); --pad-r: max(var(--gutter), env(safe-area-inset-right, 0px)); }

/* ===== 4. アプリの部品（§7.5） ===== */
/* ページとスクロール */
/* スクロールする箱はステータスバーの下から始める（上の帯は .app の --bg-page で塗る。§3.1） */
.page { position: absolute; inset: 0; top: var(--sa-top); overflow-y: auto; overflow-x: hidden; padding: 0 var(--pad-r) 0 var(--pad-l); background: var(--bg-page); overscroll-behavior: contain; }
.page.with-tabbar { bottom: calc(var(--tabbar-h) + var(--sa-bottom)); }
.screen { max-width: var(--content-max-w); margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
/* 上部バー・月切替（§3.4） */
.appbar { position: sticky; top: 0; z-index: var(--z-sticky); height: var(--appbar-h); display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l)); padding: 0 calc(var(--pad-r) - 12px) 0 calc(var(--pad-l) - 12px); background: var(--bg-page); transition: background var(--dur-fast); }
.appbar.scrolled { background: var(--bg-surface); box-shadow: 0 1px 0 var(--border); }
.appbar-title { justify-self: center; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; border-radius: var(--radius-control); font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); }
.appbar-title.off { color: var(--text-accent); }
.appbar-plain { justify-self: center; font-size: var(--fs-xl); font-weight: 700; }
/* 年月（S-04 を開くボタン）は見出しでもあるので h1 で包む（S-11・S-30 の見出しと同じ扱い） */
.appbar-h { justify-self: center; display: inline-flex; min-width: 0; font-size: inherit; font-weight: inherit; }
.appbar.left { grid-template-columns: auto 1fr 44px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-control); color: var(--text-sub); }
.iconbtn:active, .appbar-title:active { background: var(--bg-muted); }
.backbtn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 4px; color: var(--text-accent); font-size: var(--fs-lg); font-weight: 600; border-radius: var(--radius-control); }
/* ボタン */
.btn-fill { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: var(--control-h); border-radius: var(--radius-control); background: var(--bg-accent); color: var(--text-on-accent); font-size: var(--fs-lg); font-weight: 600; line-height: var(--lh-ui); padding: 0 16px; transition: background var(--dur-fast); }
.btn-fill:active { background: var(--bg-accent-pressed); }
.btn-fill.inline { width: auto; min-height: 44px; }
.btn-text { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: var(--control-h-sm); min-width: var(--tap-min); padding: 0 4px; font-size: var(--fs-lg); font-weight: 600; color: var(--text-accent); border-radius: var(--radius-control); line-height: var(--lh-ui); }
.btn-text.danger { color: var(--text-danger); }
.btn-text.sub { color: var(--text-sub); }
.btn-text:active { background: var(--bg-muted); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* アバター（§7.5） */
.av { display: inline-grid; place-items: center; flex: none; border-radius: 50%; font-weight: 700; line-height: 1; }
.av28 { width: 28px; height: 28px; font-size: 13px; }
.av20 { width: 20px; height: 20px; font-size: 12px; }
.av56 { width: 56px; height: 56px; font-size: var(--fs-display); }
.av-a { background: var(--who-a); color: var(--who-a-on); }
.av-b { background: var(--who-b); color: var(--who-b-on); }
.av-joint { background: var(--who-joint); color: var(--who-joint-on); }
.flow { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); }
/* バッジ */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 10px; border-radius: var(--radius-full); background: var(--bg-muted); color: var(--text-sub); font-size: var(--fs-sm); font-weight: 600; line-height: var(--lh-ui); white-space: nowrap; }
.badge .ic { width: 12px; height: 12px; }
/* 文字の役割 */
.cap { font-size: var(--fs-body-sm); color: var(--text-sub); font-weight: 500; }
.note { font-size: var(--fs-sm); color: var(--text-muted); font-weight: 500; line-height: var(--lh-ui); }
.note-sm { font-size: var(--fs-body-sm); color: var(--text-muted); font-weight: 500; line-height: var(--lh-ui); }
.err { font-size: var(--fs-body-sm); color: var(--text-danger); font-weight: 500; line-height: var(--lh-ui); }
.inl { font-size: var(--fs-body-sm); color: var(--text-sub); font-weight: 500; line-height: var(--lh-ui); }
.sec { font-size: var(--fs-body-sm); font-weight: 600; color: var(--text-sub); margin: 24px 0 8px; }
.msg { font-size: var(--fs-lg); color: var(--text-sub); line-height: var(--lh-body); }
.shake { animation: shake .32s var(--ease-out); }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.hl { animation: hl 1.2s var(--ease-out); }
@keyframes hl { 0%, 70% { background: var(--bg-accent-subtle); } 100% { background: transparent; } }
/* 動きは止めるが、色だけの変化（保存直後のハイライト）は残す（§7.1）。S.highlight を外すと描き直して元の地に戻る */
@media (prefers-reduced-motion: reduce) { .hl { animation: none; background: var(--bg-accent-subtle); } }
/* ハイライト中（--bg-accent-subtle の上）のメモは --text-sub（--text-muted は 3.96:1 で届かない。§7.1）。reduced-motion のときも効く */
.hl .lrow-memo { color: var(--text-sub); }
/* 一覧の行 */
.lrow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--row-min-h); padding: 8px 0; position: relative; border-radius: var(--radius-control); text-align: left; }
.lrow::after { content: ""; position: absolute; left: 40px; right: 0; bottom: 0; border-bottom: 1px solid var(--border); }
.lrow:last-child::after { display: none; }
.lrow:active { background: var(--bg-muted); }
.lrow-main { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 0; }
.lrow-cat { font-size: var(--fs-lg); font-weight: 500; line-height: var(--lh-ui); }
.lrow-memo { font-size: var(--fs-body-sm); color: var(--text-muted); font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.lrow-amt { font-size: var(--fs-lg); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lrow.muted .lrow-cat, .lrow.muted .lrow-amt { color: var(--text-muted); }
.dhead { position: sticky; top: var(--appbar-h); z-index: var(--z-raised); height: 32px; display: flex; align-items: center; margin: 8px calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l)); padding: 0 var(--pad-r) 0 var(--pad-l); background: var(--bg-subtle); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: var(--fs-body-sm); font-weight: 600; color: var(--text-sub); }
/* 金額待ちの行（破線） */
.prow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 0 12px; margin-bottom: 8px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-control); background: var(--bg-surface); text-align: left; }
.prow:active { background: var(--bg-muted); }
.prow .ic { color: var(--text-sub); }
.prow-name { flex: 1; font-size: var(--fs-lg); font-weight: 500; min-width: 0; }
.prow-go { font-size: var(--fs-md); font-weight: 600; color: var(--text-accent); white-space: nowrap; }
.dash-tag { display: inline-flex; align-items: center; padding: 2px 8px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius-tag); font-size: var(--fs-body-sm); color: var(--text-sub); font-weight: 600; }
/* お知らせ行・オフラインの行（§3.5・§3.6） */
.notice { display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--notice-h); padding: 0 12px; margin: 4px 0 8px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-card); font-size: var(--fs-md); font-weight: 500; color: var(--text-main); text-align: left; }
.notice > .ic:first-child { color: var(--text-accent); }
.notice span { flex: 1; }
.notice .ic:last-child { color: var(--text-muted); }
.offline { display: flex; align-items: center; gap: 6px; height: var(--offline-h); margin: 0 calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l)); padding: 0 var(--pad-r) 0 var(--pad-l); background: var(--bg-muted); color: var(--text-sub); font-size: var(--fs-body-sm); font-weight: 500; }
.offline .ic { width: 16px; height: 16px; }
/* タブバー（§3.1） */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: var(--z-sticky); display: grid; grid-template-columns: repeat(4, 1fr); height: calc(var(--tabbar-h) + var(--sa-bottom)); padding: 0 env(safe-area-inset-right, 0px) var(--sa-bottom) env(safe-area-inset-left, 0px); background: var(--bg-surface); border-top: 1px solid var(--border); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-muted); font-size: var(--fs-xs); font-weight: 600; line-height: 1.2; transition: background var(--dur-fast); }
.tab:active { background: var(--bg-muted); }
.tab-ic { position: relative; width: 56px; height: 28px; display: grid; place-items: center; border-radius: var(--radius-full); }
.tab-ic .ic { width: 24px; height: 24px; }
.tab.on { color: var(--text-accent); }
.tab.on .tab-ic { background: var(--bg-accent-subtle); }
.dot { position: absolute; top: 1px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--text-danger); }
/* 一覧の下の余白（記録は記録タブで行うので、支出タブに ＋ 記録 は置かない） */
.list-end { height: 16px; flex: none; }
/* トースト（§3.7） */
.toast { position: absolute; left: var(--pad-l); right: var(--pad-r); bottom: calc(var(--tabbar-h) + var(--sa-bottom) + 8px); z-index: var(--z-toast); display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 8px 6px 16px; border-radius: var(--radius-card); background: var(--bg-inverse); color: var(--text-on-inverse); font-size: var(--fs-md); font-weight: 500; line-height: var(--lh-ui); box-shadow: var(--shadow-toast); }
.toast:empty { display: none; }
.toast.nobar { bottom: calc(var(--sa-bottom) + 16px); }
.toast-t { flex: 1; }
.toast-u { min-height: 44px; padding: 0 8px; color: var(--text-inverse-action); font-weight: 700; font-size: var(--fs-md); white-space: nowrap; border-radius: var(--radius-control); }
/* 背景幕とボトムシート（§4.0.3） */
.backdrop { position: absolute; inset: 0; z-index: var(--z-overlay); background: var(--backdrop); animation: fade var(--dur) var(--ease-out); }
@keyframes fade { from { opacity: 0; } }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: var(--z-sheet); max-height: var(--sheet-max-h); display: flex; flex-direction: column; background: var(--bg-surface); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-sheet); padding: 0 var(--pad-r) calc(16px + var(--sa-bottom)) var(--pad-l); overflow-y: auto; overscroll-behavior: contain; }
.sheet.tall { max-height: var(--sheet-tall-max-h); }
/* 操作の無いシート（S-13・S-22 など）はシート自身に tabindex=-1 でフォーカスを移す。入れ物なので枠は描かない */
.sheet[tabindex="-1"]:focus { outline: none; }
.sheet.enter { animation: up var(--dur) var(--ease-out); }
@keyframes up { from { transform: translateY(40%); opacity: .4; } }
/* つまみは「閉じる」の読み上げ名を持つボタン（見た目は 36×4px の棒だけ。押すと背景のタップと同じく閉じる） */
.grip { flex: none; width: 100%; height: 20px; display: grid; place-items: center; touch-action: none; cursor: grab; border-radius: var(--radius-control); }
.grip::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--border-strong); }
.sh-root { display: flex; flex-direction: column; min-height: 0; flex: 1; max-width: var(--content-max-w); width: 100%; margin: 0 auto; }
.sh-title { font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); }
.sh-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.sh-foot { position: sticky; bottom: 0; background: var(--bg-surface); padding-top: 8px; }
.sh-foot.split { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sh-foot.split .btn-fill { flex: 1; max-width: 200px; }
/* テンキー（§7.5） */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--keypad-gap); }
.key { height: var(--keypad-key-h); border-radius: var(--radius-control); background: var(--bg-muted); color: var(--text-main); font-size: var(--fs-display); font-weight: 500; display: grid; place-items: center; font-variant-numeric: tabular-nums; transition: background var(--dur-fast); }
.key:active { background: var(--bg-accent-subtle); }
.key .ic { width: 24px; height: 24px; }
.amt-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
.amt-row .note { max-width: 50%; }
/* その場の1行（S-12・S-14・S-15）: 金額の行の左、条件つきの注記の代わりに出す。高さを増やさない（2行まで。7桁のときだけ3行） */
.amt-row .amt-msg { max-width: 50%; font-size: var(--fs-body-sm); line-height: var(--lh-ui); font-weight: 500; }
.amt-in { margin-left: auto; font-size: var(--fs-4xl); font-weight: 700; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt-in .yen { font-size: .75em; margin-right: 2px; }
.amt-in.zero { color: var(--text-muted); }
/* セグメント（§7.5） */
/* 項目のタップ領域は高さ 44px いっぱい。選択中のピルは内側に描く（B12）。選択中はチップ・グリッドと同じ --bg-accent-subtle ＋ 縁 --text-accent */
.seg { display: flex; gap: 2px; height: 44px; padding: 0; border-radius: var(--radius-full); background: var(--bg-muted); box-shadow: inset 0 0 0 1px var(--border); }
.seg-i { position: relative; isolation: isolate; flex: 1; min-width: 0; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; border-radius: var(--radius-full); color: var(--text-sub); font-size: var(--fs-md); font-weight: 500; white-space: nowrap; overflow: hidden; }
.seg-i.on { color: var(--text-accent-strong); font-weight: 600; }
.seg-i.on::before { content: ""; position: absolute; inset: 3px; z-index: -1; border-radius: var(--radius-full); background: var(--bg-accent-subtle); box-shadow: inset 0 0 0 1px var(--text-accent); }
/* 払った人: アバターは欠けさせず、呼び名の末尾を…で省く */
.seg-p .seg-i { padding: 0 4px; gap: 4px; }
.seg-p .seg-i > span:not(.av) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.date-ovl { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; pointer-events: none; border: 0; }
.lab { font-size: var(--fs-sm); color: var(--text-sub); font-weight: 600; line-height: 22px; }
/* チップ */
.chip { display: inline-flex; align-items: center; min-height: 44px; max-width: 100%; }
.chip-in { display: inline-flex; align-items: center; gap: 6px; height: var(--chip-h); padding: 0 14px; border-radius: var(--radius-full); background: var(--bg-muted); color: var(--text-sub); font-size: var(--fs-md); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.chip.on .chip-in { background: var(--bg-accent-subtle); color: var(--text-accent-strong); }
/* カテゴリのグリッド（§7.5） */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cell { height: var(--grid-cell-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--bg-surface); font-size: var(--fs-md); font-weight: 500; position: relative; }
.cell .ic { width: 24px; height: 24px; color: var(--text-sub); }
.cell:active { background: var(--bg-muted); }
.cell.on { background: var(--bg-accent-subtle); color: var(--text-accent-strong); border-color: var(--border-accent); }
.cell.on .ic { color: var(--text-accent-strong); }
.cell .chk { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; }
/* 記録タブ（S-11）のグリッドの下の余白。オフラインの行が出ているときだけ 16 → 8px に詰める（セルの高さ 72px は変えない。§4 S-11 の「縦の寸法」） */
.s11-grid { margin-top: 8px; padding-bottom: 16px; }
.s11-grid.tight { padding-bottom: 8px; }
/* 月を選ぶ（S-04）: 年の行（‹ 2026 ›）と 12か月のマス（3列×4行）。高さ 56px・文字 16px。選択中は セグメント と同じ（--text-accent の縁 ＋ 600）で、カテゴリのグリッド（--border-accent・14px・500）とは縁と文字が違う（§7.5・S-04） */
.yearbar { display: grid; grid-template-columns: var(--tap-min) 1fr var(--tap-min); align-items: center; min-height: var(--tap-min); }
.yearbar .iconbtn { color: var(--text-accent); }   /* §7.5 年の行: ‹ › は 20px --text-accent */
.yearbar .y { text-align: center; font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.mcell { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--bg-surface); color: var(--text-main); font-size: var(--fs-lg); font-weight: 500; }
.mcell:active { background: var(--bg-muted); }
.mcell.on { background: var(--bg-accent-subtle); color: var(--text-accent-strong); border-color: var(--text-accent); font-weight: var(--fw-semibold); }
.mcell small { font-size: var(--fs-sm); font-weight: 500; color: var(--text-sub); line-height: 1; }
.mcell.on small { color: var(--text-accent-strong); }
/* 家計を作る前の月・今月より先の月はボタンにしない（P7）。--text-disabled の文字だけ */
.mcell.off { color: var(--text-disabled); background: transparent; border-color: transparent; }
/* 入力欄（文字） */
.field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.field > label, .flab { font-size: var(--fs-body-sm); font-weight: 600; color: var(--text-sub); line-height: var(--lh-ui); }
.field > .err, .field > .inl { margin-top: 0; }
.inp { height: var(--control-h); width: 100%; padding: 0 12px; border-radius: var(--radius-control); background: var(--bg-input); border: 1px solid var(--border-strong); color: var(--text-main); font-size: var(--fs-input); font-weight: 500; }
.inp::placeholder { color: var(--text-placeholder); }
.inp:focus { outline: 2px solid var(--focus-ring); outline-offset: 0; border-color: transparent; }
.inp.bad { border-color: var(--border-danger); }
.pw { position: relative; }
.pw .inp { padding-right: 48px; }
.pw .iconbtn { position: absolute; right: 2px; top: 2px; }
.pre { position: relative; }
.pre .inp { padding-left: 32px; }
.pre > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: var(--fs-lg); font-weight: 600; }
/* カード（精算） */
/* カード: 外枠は押せない div。カード全体を覆う透明のボタン（.scard-hit）で S-22 を開き、チェックのボタンはその上に兄弟として重ねる（入れ子にしない） */
.scard { position: relative; padding: 16px; margin-bottom: 8px; border-radius: var(--radius-card); background: var(--bg-surface); border: 1px solid var(--border); }
.scard:has(> .scard-hit:active) { background: var(--bg-muted); }
.scard-hit { position: absolute; inset: 0; width: 100%; border-radius: inherit; cursor: pointer; }
.scard-go { flex: none; color: var(--text-muted); }
.scard-h { display: flex; align-items: center; gap: 8px; }
.scard-name { flex: 1; font-size: var(--fs-lg); font-weight: 600; line-height: var(--lh-ui); }
.scard-f { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: var(--fs-md); color: var(--text-sub); font-weight: 500; }
.scard-a { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.scard-a.has-chk { min-height: 44px; }
.scard .inl { margin-top: 4px; }
.big { font-size: var(--fs-3xl); font-weight: 700; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
.big.est { color: var(--text-sub); }
.big .ato { font-size: var(--fs-lg); font-weight: 600; margin-right: 4px; }
.scard .msg-zero { margin-top: 8px; font-size: var(--fs-lg); color: var(--text-sub); font-weight: 500; }
/* チェックのボタン: 未チェックは 自分のカード = 塗り（btn-fill）、相手のカード = 文字のボタン（btn-text。16px semibold --text-accent）。
   付いたチェックは灰色の文字のボタン（btn-text sub）に ✓ 16px。どれも高さ 44px */
.chkbtn { position: relative; z-index: 1; min-height: 44px; }
.chkbtn.btn-fill { width: auto; padding: 0 20px; }
.chkbtn .ic { width: 16px; height: 16px; }
/* 共用の行: 上は 8px（カードの下の間 8px をそのまま使う）。高さ 24px（1行の UI の行間 1.4 で文字 22px ＋ アバター 20px が収まる） */
.jline { display: flex; align-items: center; gap: 8px; margin-top: 0; min-height: 24px; font-size: var(--fs-lg); line-height: var(--lh-ui); color: var(--text-main); }
.jline b { font-weight: 600; }
/* 共用の行の注記（うち 給料の残り n円）。家のアイコン 20 ＋ すきま 8 の分だけ字下げして、文の頭にそろえる */
.jline-sub { margin: 2px 0 0 28px; }
/* 状態の1行と数字の無い式を1つの行に（状態 --text-sub ＋ 全角の空白 ＋ 式 --text-muted。入りきらなければ式が次の行へ） */
.stline { display: flex; flex-wrap: wrap; align-items: center; font-size: var(--fs-body-sm); color: var(--text-sub); font-weight: 500; line-height: var(--lh-ui); min-height: 28px; padding: 4px 0; }
.stline .ic { width: 14px; height: 14px; }
.st-t { display: inline-flex; align-items: center; gap: 4px; }
.st-f { color: var(--text-muted); white-space: nowrap; }
.stline + .inl { margin: 0 0 4px; }
.calc { margin-top: 4px; padding: 4px 0 8px; }
.calc p { font-size: var(--fs-body-sm); color: var(--text-sub); line-height: var(--lh-ui); }
.calc .calc-n { font-weight: 600; margin-top: 8px; }
.s20-foot { position: sticky; bottom: 0; margin: auto calc(-1 * var(--pad-r)) 0 calc(-1 * var(--pad-l)); padding: 8px var(--pad-r) 12px var(--pad-l); background: var(--bg-page); z-index: var(--z-raised); }
/* その場の1行が出ているあいだは、上 4・1行の上 2・下 0 にして固定部分を 72px に抑える（ふだんは 上 8 ＋ 48 ＋ 下 12 ＝ 68px） */
.s20-foot.with-msg { padding-top: 4px; padding-bottom: 0; }
/* 文字ボタンだけの固定部分（estimate の「この月を精算する」）は 8 ＋ 44 ＋ 4 ＝ 56px。
   オフラインの行が出ても、見込みの注記（金額待ち n件を含みません）が裏に入らない高さ（§4 S-20・B9） */
.s20-foot.text-only { padding-bottom: 4px; text-align: center; }
.s20-foot .inl, .s20-foot .err { margin-top: 2px; }
.prep-list { margin: 8px 0 4px; padding: 0; list-style: none; font-size: var(--fs-lg); line-height: var(--lh-body); }
.dblock { padding: 16px; border-radius: var(--radius-card); background: var(--bg-surface); border: 1px solid var(--border); margin-top: 8px; }
.drow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 8px; padding: 6px 0; }
.drow .note { grid-column: 2 / 4; }
.big20 { font-size: var(--fs-2xl); font-weight: 700; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; }
/* 横棒（S-13） */
.hbar { height: 6px; border-radius: var(--radius-full); background: var(--bg-muted); overflow: hidden; margin-top: 6px; }
.hbar > i { display: block; height: 100%; border-radius: var(--radius-full); background: var(--text-muted); }
/* 設定の行 */
.srow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: var(--row-min-h); padding: 8px 12px; background: var(--bg-surface); text-align: left; font-size: var(--fs-lg); font-weight: 500; position: relative; }
.srow + .srow { border-top: 1px solid var(--border); }
.srow:active { background: var(--bg-muted); }
.srow:focus-visible { outline-offset: -2px; }
.srow .grow { flex: 1; min-width: 0; }
.srow .val { color: var(--text-sub); font-size: var(--fs-md); white-space: nowrap; }
.srow > .ic:last-child { color: var(--text-muted); }
/* 設定の行（2段。ラベル ＋ セグメント。S-30 の「記録の払った人」。高さ 4 ＋ 18 ＋ 4 ＋ 44 ＋ 6 ＝ 76px） */
.srow-seg { padding: 4px 12px 6px; background: var(--bg-surface); }
.srow-seg > .slab { display: block; font-size: var(--fs-body-sm); font-weight: 600; color: var(--text-sub); line-height: 18px; margin-bottom: 4px; }
.srow-seg + .srow, .srow + .srow-seg { border-top: 1px solid var(--border); }
.sgroup { border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--border); background: var(--bg-surface); }
.linkrow { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; color: var(--text-accent); font-size: var(--fs-lg); font-weight: 500; }
.total { font-size: var(--fs-3xl); font-weight: 700; line-height: var(--lh-tight); font-variant-numeric: tabular-nums; margin-top: 2px; }
.divider { border: 0; border-top: 1px solid var(--border); margin: 12px 0; width: 100%; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: var(--fs-lg); padding: 2px 0; }
.kv .num { font-weight: 600; }
.kv.sub { font-size: var(--fs-body-sm); color: var(--text-muted); padding-left: 12px; }
/* S-33 相手の行の読み取り専用（出す割合・給料の入り先は本人だけが変えられる。§2.2）。
   押せないボタンは作らない（P7）ので、セグメントや欄ではなく値の表示にする */
.rov { min-height: 44px; display: flex; align-items: center; font-size: var(--fs-lg); font-weight: 600; color: var(--text-main); line-height: var(--lh-ui); }
.ro-note { font-size: var(--fs-body-sm); color: var(--text-sub); font-weight: 500; line-height: var(--lh-ui); margin-top: 8px; }
.colors { display: flex; gap: 16px; }
.colorbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 2px solid transparent; }
.colorbtn.on { border-color: var(--text-main); }
/* 丸には --text-muted の 1px の縁（amber は白地で 3:1 に届かないため。選択中も未選択も） */
.colorbtn > span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--text-muted); }
.cpick-a { background: var(--who-a); color: var(--who-a-on); }
.cpick-b { background: var(--who-b); color: var(--who-b-on); }

/* ===== 5. 画面ごと ===== */
.s01 { justify-content: center; padding: 24px 0 32px; gap: 4px; }
.appname { font-size: var(--fs-display); font-weight: 700; text-align: center; margin-bottom: 20px; line-height: var(--lh-tight); }
.s02 { align-items: stretch; padding: 40px 0 24px; }
.s03-steps { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 12px; }
.s03-steps li { display: flex; align-items: center; gap: 12px; font-size: var(--fs-lg); font-weight: 500; }
.s03-steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-muted); color: var(--text-sub); font-size: var(--fs-md); font-weight: 700; }
.s03-steps .ic { color: var(--text-sub); }   /* 押せないので青にしない */
/* S-21 の行は 80px（1段目 28 ＋ 間 4 ＋ 2段目 48）、行と行の間 8px */
.s21-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 28px; }
.s21-head .err { white-space: nowrap; }
.s21row + .s21row { margin-top: 8px; }
.s21h { display: flex; align-items: center; gap: 8px; height: 28px; }
.s21h .scard-name { flex: none; }
/* 「決めた: …」は右端に寄せ、狭いときは省く。「給料は共用に入る」は名前のすぐ右に置き、省かない（並びは 名前 → 給料は共用に入る → 決めた） */
.s21h .note-decided { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s21h .note-sj { margin-left: 8px; flex: none; text-overflow: clip; white-space: nowrap; }
.s21f { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: var(--fs-md); color: var(--text-sub); flex-wrap: nowrap; }
.netfield { flex: 1; min-width: 0; height: var(--control-h); border-radius: var(--radius-control); border: 1px solid var(--border-strong); background: var(--bg-input); font-size: var(--fs-lg); font-weight: 500; text-align: right; padding: 0 10px; font-variant-numeric: tabular-nums; color: var(--text-main); }
.netfield.on { outline: 2px solid var(--focus-ring); outline-offset: 0; border-color: transparent; }
/* 出す額は --text-main（「手取り」「× 40% ＝」は .s21f の --text-sub のまま） */
.s21amt { min-width: 96px; text-align: right; color: var(--text-main); }
/* S-22 の結果の行の動かす額（24px bold・右揃え。見込みは --text-sub） */
.s22-amt { font-size: var(--fs-display); font-weight: 700; line-height: var(--lh-tight); text-align: right; }
.s22-amt.est { color: var(--text-sub); }
.s22-amt .ato { font-size: var(--fs-lg); font-weight: 600; margin-right: 4px; }
.s22-list .lrow { min-height: 44px; }
.memo-in { margin: 8px 0; }

/* ===== 6. モック操作（§10。アプリの外。見た目もアプリと分ける） ===== */
.mk-panel { width: 340px; flex: none; position: sticky; top: 16px; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--mock-bg); color: var(--mock-fg); border: 2px dashed var(--mock-border); border-radius: 14px; padding: 12px 14px 16px; font: 500 13px/1.5 var(--mock-font); z-index: var(--z-max); }
.mk-panel h2 { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--mock-head); margin: 14px 0 6px; text-transform: uppercase; }
.mk-head { display: flex; align-items: center; gap: 8px; }
.mk-head strong { font-size: 14px; }
.mk-tag { font: 700 10px/1 var(--mock-font); background: var(--mock-accent); color: var(--mock-accent-on); padding: 3px 6px; border-radius: 4px; letter-spacing: .06em; }
.mk-head .mk-x { margin-left: auto; }
.mk-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mk-btn { min-height: 32px; padding: 0 10px; border-radius: 8px; background: var(--mock-bg2); color: var(--mock-fg); border: 1px solid var(--mock-line); font-size: 13px; font-weight: 600; }
.mk-btn[aria-pressed="true"] { background: var(--mock-accent); color: var(--mock-accent-on); border-color: var(--mock-accent); }

/* ---------------------------------------------------------------------
   2. CALC — §6.2 計算のきまり（正本）。DOM に触らない純粋関数
   --------------------------------------------------------------------- */
const CALC = (() => {
  const monthOf = (date) => date.slice(0, 7);
  const addMonth = (m, k) => {
    let y = +m.slice(0, 4), mo = +m.slice(5, 7) + k;
    while (mo > 12) { mo -= 12; y++; }
    while (mo < 1) { mo += 12; y--; }
    return y + '-' + String(mo).padStart(2, '0');
  };
  /* 出す額_i = floor(手取り_i × 割合_i ÷ 100)。割合は整数の % で持ち、浮動小数の誤差を避ける（§6.2・§6.3 ケースL） */
  const contributionOf = (net, ratePct) => Math.floor(net * ratePct / 100);
  /* その月に使う出す割合: その月に保存した割合があればそれ（決め直しても変えない）、無ければ人の割合（S-21・§6.2） */
  const rateFor = (d, m, p) => { const c = (d.contributions[m] || {})[p]; return c ? c.ratePct : d.people[p].ratePct; };
  /* その月に使う給料の入り先: その月に保存した値があればそれ、無ければ人の設定（S-33・§6.2）。
     保存した値は決め直すと人の今の設定で上書きされる（MODEL.decideContributions） */
  const salaryToJointFor = (d, m, p) => { const c = (d.contributions[m] || {})[p]; return c ? !!c.salaryToJoint : !!d.people[p].salaryToJoint; };
  /* 共用に入った給料_i ＝ その月の給料の入り先が共用なら min(手取り_i, 出す額_i)、そうでなければ 0（§6.2）。
     手取りか出す額が未入力の月は 0（出す額も決まっていない。§6.3 ケースN） */
  const jointSalaryOf = (net, contribution, toJoint) => (toJoint && net != null && contribution != null ? Math.min(net, contribution) : 0);
  /* 共用に入る人の手取り（入らない人は 0）。共用の通帳の動きに使う（V11） */
  const salaryInOf = (net, toJoint) => (toJoint && net != null ? net : 0);
  /* 金額待ち = 毎月の支払いの行で金額が無く、今月はなしでもない */
  const isPending = (e) => !!e.tpl && e.amount == null && !e.skipped;
  /* 対象 = 金額が入っていて、今月はなしでなく、未送信でない（§6.2・V7） */
  const isCounted = (e) => e.amount != null && !e.skipped && !e.sync;
  const isLockedStatus = (st) => st === 'confirmed' || st === 'settled';

  /* その月（帰属月）の集計 */
  function summarize(expenses, m) {
    const rows = expenses.filter((e) => e.month === m);
    const adv = { a: 0, b: 0 }, advRows = { a: [], b: [] };
    let joint = 0, total = 0, count = 0;
    const byCatMap = new Map();
    for (const e of rows) {
      if (!isCounted(e)) continue;
      count++; total += e.amount;
      if (e.payer === 'joint') joint += e.amount;
      else { adv[e.payer] += e.amount; advRows[e.payer].push(e); }
      byCatMap.set(e.cat, (byCatMap.get(e.cat) || 0) + e.amount);
    }
    const byCat = [...byCatMap.entries()].map(([cat, amount]) => ({ cat, amount })).sort((x, y) => y.amount - x.amount);
    const pending = rows.filter(isPending);
    const fixedRows = rows.filter((e) => e.tpl && !isPending(e));
    const fixedCounted = fixedRows.filter(isCounted);
    const fixedSum = fixedCounted.reduce((s, e) => s + e.amount, 0);
    const deferredOut = expenses.filter((e) => e.tpl && e.labelMonth === m && e.month !== m);
    const manual = rows.filter((e) => !e.tpl);
    const unsent = rows.filter((e) => e.sync);
    return { m, rows, adv, advRows, joint, total, count, byCat, pending, fixedRows, fixedCount: fixedCounted.length, fixedSum, deferredOut, manual, unsent };
  }

  /* 精算額_i ＝ 出す額_i − 立替_i − 共用に入った給料_i（§6.2）
     共用の過不足（jointNet）＝ Σ出す額 − 支出合計（今までどおり。給料は入れない）
     給料の残り（salaryLeft）＝ Σ(手取り_i − 共用に入った給料_i)（共用に入る人だけ。出す額を超えて共用に残る分）
     共用の通帳の動き（jointBook）＝ 共用の過不足 ＋ 給料の残り
       ＝ Σ手取り(共用に入る人) ＋ Σ正の精算額 − 共用払い − Σ|負の精算額|（V11） */
  function computeSettle(contrib, adv, total, js = { a: 0, b: 0 }, salaryIn = { a: 0, b: 0 }) {
    const settle = { a: contrib.a - adv.a - js.a, b: contrib.b - adv.b - js.b };
    const jointNet = contrib.a + contrib.b - total;
    const salaryLeft = (salaryIn.a - js.a) + (salaryIn.b - js.b);
    return { settle, jointNet, salaryLeft, jointBook: jointNet + salaryLeft };
  }
  /* 残り_i = 精算額_i − 済んだ分_i（済んだ分は 入れた＋、受け取った−） */
  const remainingOf = (settle, transferred) => ({ a: settle.a - transferred.a, b: settle.b - transferred.b });

  /* §4.0.2 月の状態: open / closing / confirmed / settled */
  function monthStatus(d, m, now) {
    const rec = d.settlements[m];
    if (rec && rec.status) return rec.status;
    return m < monthOf(now) ? 'closing' : 'open';
  }

  /* 精算の見え方（S-20・S-22 共通）。精算中・精算済みは［この金額で精算］時点の保存値から出す（§6.2） */
  function settleModel(d, m, now) {
    const status = monthStatus(d, m, now);
    const rec = d.settlements[m] || null;
    const sum = summarize(d.expenses, m);
    const cm = d.contributions[m] || {};
    const snap = isLockedStatus(status) && rec && rec.snapshot ? rec.snapshot : null;
    const contrib = snap ? snap.contrib : { a: cm.a ? cm.a.amount : null, b: cm.b ? cm.b.amount : null };
    const net = snap ? snap.net : { a: cm.a ? cm.a.net : null, b: cm.b ? cm.b.net : null };
    const ratePct = snap ? snap.ratePct : { a: rateFor(d, m, 'a'), b: rateFor(d, m, 'b') };
    const adv = snap ? snap.adv : sum.adv;
    const joint = snap ? snap.joint : sum.joint;
    const total = snap ? snap.total : sum.total;
    /* 給料の入り先も、精算中・精算済みは［この金額で精算］時点の保存値を使う（あとで設定を変えても動かない。§6.3 ケースN） */
    const salaryToJoint = snap && snap.salaryToJoint ? { ...snap.salaryToJoint } : { a: salaryToJointFor(d, m, 'a'), b: salaryToJointFor(d, m, 'b') };
    const jointSalary = { a: jointSalaryOf(net.a, contrib.a, salaryToJoint.a), b: jointSalaryOf(net.b, contrib.b, salaryToJoint.b) };
    const salaryIn = { a: salaryInOf(net.a, salaryToJoint.a), b: salaryInOf(net.b, salaryToJoint.b) };
    const decided = contrib.a != null && contrib.b != null;
    const r = decided ? computeSettle(contrib, adv, total, jointSalary, salaryIn) : { settle: null, jointNet: null, salaryLeft: 0, jointBook: null };
    const transferred = rec && rec.transferred ? { ...rec.transferred } : { a: 0, b: 0 };
    const remaining = r.settle ? remainingOf(r.settle, transferred) : null;
    return {
      m, status, rec, sum, contrib, net, ratePct, adv, joint, total, decided,
      salaryToJoint, jointSalary, salaryIn, anySalary: salaryToJoint.a || salaryToJoint.b,
      salaryLeft: r.salaryLeft, jointBook: r.jointBook,
      settle: r.settle, jointNet: r.jointNet, transferred, remaining,
      checks: rec && rec.checks ? rec.checks : {}, done: rec && rec.done ? rec.done : { a: [], b: [] },
      pending: sum.pending, hasTransferred: transferred.a !== 0 || transferred.b !== 0,
      /* チェックの記録がある（やり直した後。済んだ分の合計が 0 でも）。S-20 の redo と、数字の無い式を出さない条件に使う */
      hasDone: !!(rec && rec.done && (rec.done.a.length > 0 || rec.done.b.length > 0)),
    };
  }

  /* S-20 の状態の決め方（上から順に当てはまったもの）。
     settleNow = 「この月を精算する」を押した月（画面の状態。保存しない）。その月は、月の途中でも estimate を飛ばして prep / ready になる（§4 S-20）。
     やり直し中（hasDone）の月も見込みには戻さない。月の途中でも下の pending → hasDone に落として prep / redo を出す */
  function s20State(d, model, settleNow) {
    if (model.status === 'settled') return 'settled';
    if (model.status === 'confirmed') return 'transfer';
    /* empty: その月にも前の月にも、出す額を決めた人がいない */
    const cm = d.contributions[model.m] || {}, pm = d.contributions[addMonth(model.m, -1)] || {};
    if (!(cm.a || cm.b || pm.a || pm.b)) return 'empty';
    if (!model.decided) return 'undecided';
    if (model.status === 'open' && settleNow !== model.m && !model.hasDone) return 'estimate';
    if (model.pending.length) return 'prep';
    if (model.hasDone) return 'redo';
    return 'ready';
  }

  function monthsUntil(d, now) {
    const out = []; let m = d.household.createdMonth; const cur = monthOf(now);
    while (m <= cur) { out.push(m); m = addMonth(m, 1); }
    return out;
  }

  /* §3.2 赤い点・§3.5 お知らせ行の判定（同じ条件）。一番古い月の1つだけ。
     どちらも「月が終わったあと」だけ出す。closing は monthStatus の決め方でもう終わった月だけ。
     confirmed は月の途中でも精算できる（§4 S-20「この月を精算する」）ので、m < monthOf(now) で限る（§4.0.2） */
  function attention(d, viewer, now) {
    for (const m of monthsUntil(d, now)) {
      const st = monthStatus(d, m, now);
      if (st === 'closing') return { kind: 1, m };
      if (st === 'confirmed' && m < monthOf(now)) {
        const md = settleModel(d, m, now);
        if (md.remaining && md.remaining[viewer] !== 0 && !md.checks[viewer]) return { kind: 2, m, amount: md.remaining[viewer] };
      }
    }
    return null;
  }

  /* §3.4 精算タブの既定の月: 締め待ちか精算中のうち一番古い月。無ければ今月 */
  function defaultSettleMonth(d, now) {
    for (const m of monthsUntil(d, now)) {
      const st = monthStatus(d, m, now);
      if (st === 'closing' || st === 'confirmed') return m;
    }
    return monthOf(now);
  }

  /* 名前からカテゴリを推測（S-32・§8 の決め方）: 名前に含まれる語のうち一番長い語のカテゴリ。
     同じ長さなら §8 の並びが先のカテゴリ。大文字・小文字は区別しない。当たらなければ null */
  function guessCategory(name) {
    const n = (name || '').toLowerCase();
    let best = null, bestLen = 0;
    for (const c of CATEGORIES) {
      for (const g of c.guess) {
        const len = [...g].length;
        if (len > bestLen && n.includes(g.toLowerCase())) { best = c.key; bestLen = len; }
      }
    }
    return best;
  }

  return { monthOf, addMonth, contributionOf, rateFor, salaryToJointFor, jointSalaryOf, salaryInOf, isPending, isCounted, isLockedStatus, summarize, computeSettle, remainingOf, monthStatus, settleModel, s20State, monthsUntil, attention, defaultSettleMonth, guessCategory };
})();

/* ---------------------------------------------------------------------
   3. MODEL — データを変える操作（シナリオの組み立てと画面の操作で同じ関数を使う）
   --------------------------------------------------------------------- */
const MODEL = (() => {
  let seq = 0;
  function row(t) {
    const [id, date, payer, cat, amount, memo, by, at, x = {}] = t;
    return {
      id, date, month: x.month || CALC.monthOf(date), labelMonth: x.tpl ? (x.labelMonth || CALC.monthOf(date)) : null,
      payer, cat, amount, memo, tpl: x.tpl || null, by, at,
      amountBy: x.amountBy || null, amountAt: x.amountAt || null, skipped: false, sync: null, editedAt: null, seq: ++seq,
    };
  }
  const find = (d, id) => d.expenses.find((e) => e.id === id);
  const nextSeq = () => ++seq;

  /* 金額待ちに金額を入れる（S-15） */
  function fillAmount(d, id, amount, by, at) { const e = find(d, id); e.amount = amount; e.amountBy = by; e.amountAt = at; e.skipped = false; }
  /* 来月に回す（帰属月 +1。「（9月分）」の表記は残る） */
  function deferRow(d, id) { const e = find(d, id); e.month = CALC.addMonth(e.month, 1); }
  /* 今月はなし（行を消さずに状態を変える） */
  function skipRow(d, id) { const e = find(d, id); e.skipped = true; }

  /* ［この金額で精算］: 値を保存してロック。2人とも 0円ならそのまま精算済み */
  function confirmMonth(d, m, by, at) {
    const md = CALC.settleModel(d, m, at);
    const rec = d.settlements[m] || (d.settlements[m] = { transferred: { a: 0, b: 0 }, done: { a: [], b: [] }, checks: {} });
    rec.status = 'confirmed'; rec.confirmedBy = by; rec.confirmedAt = at; rec.checks = {};
    rec.snapshot = { contrib: { ...md.contrib }, net: { ...md.net }, ratePct: { ...md.ratePct }, salaryToJoint: { ...md.salaryToJoint }, adv: { ...md.adv }, joint: md.joint, total: md.total,
      settle: { ...md.settle }, jointSalary: { ...md.jointSalary }, jointNet: md.jointNet, salaryLeft: md.salaryLeft, jointBook: md.jointBook };
    const rem = CALC.remainingOf(md.settle, rec.transferred);
    if (rem.a === 0 && rem.b === 0) { rec.status = 'settled'; rec.settledAt = at; }
    return rec.status;
  }
  /* 出す額の行を作る（S-21［決める］・S-20［この額で決める］。04 §8.3 の RPC decide_contributions と同じ形）。
     決め直したときは、割合はその月に保存した値のまま・給料の入り先は人の今の設定を取り込む（§6.2）。
     nets = { a?: 手取り, b?: 手取り }。渡された人の行だけを { net, ratePct, amount, by, at } で作って返す（d は変えない。
     保存は呼ぶ側で d.contributions[m] に入れる。表示〈S-21 の出す額・S-20 の出す額のブロック〉も同じ関数で出す） */
  function decideContributions(d, m, nets, by, at) {
    const out = {};
    for (const p of ['a', 'b']) {
      if (nets[p] == null) continue;
      /* 出す割合は「これからこうする」取り決めなので、決め直してもその月に保存した割合のまま（CALC.rateFor。§6.2） */
      const ratePct = CALC.rateFor(d, m, p);
      /* 給料の入り先は「その月の給料が実際にどこへ入ったか」という事実なので、決め直すと人の今の設定（S-33）を取り込む（§6.2） */
      out[p] = { net: nets[p], ratePct, amount: CALC.contributionOf(nets[p], ratePct), salaryToJoint: !!d.people[p].salaryToJoint, by, at };
    }
    return out;
  }
  /* ［入れた］／［受け取った］。もう一度押すと外れる。そろったら自動で精算済み */
  function toggleCheck(d, m, p, by, at) {
    const rec = d.settlements[m];
    const md = CALC.settleModel(d, m, at);
    if (rec.checks[p]) { delete rec.checks[p]; }
    else rec.checks[p] = { by, at, amount: md.remaining[p] };
    const all = ['a', 'b'].every((q) => md.remaining[q] === 0 || rec.checks[q]);
    const was = rec.status;
    if (all) { rec.status = 'settled'; if (was !== 'settled') rec.settledAt = at; }
    else { rec.status = 'confirmed'; rec.settledAt = null; }
    return { settledNow: all && was !== 'settled', checked: !!rec.checks[p] };
  }
  /* ［精算をやり直す］: 締め待ちに戻す。付いていたチェックは「済んだ分」として残す（§6.3 ケースI） */
  function reopenMonth(d, m, by, at) {
    const rec = d.settlements[m];
    const md = CALC.settleModel(d, m, at);
    for (const p of ['a', 'b']) {
      const c = rec.checks[p];
      if (c && md.remaining[p] !== 0) { rec.transferred[p] += md.remaining[p]; rec.done[p].push({ amount: md.remaining[p], at: c.at, by: c.by }); }
    }
    rec.checks = {}; rec.status = null; rec.snapshot = null; rec.settledAt = null; rec.reopenedBy = by; rec.reopenedAt = at;
  }
  return { row, find, nextSeq, fillAmount, deferRow, skipRow, confirmMonth, decideContributions, toggleCheck, reopenMonth };
})();

/* 見本データからシナリオ sc の時点のデータを作る（純粋: 毎回新しいオブジェクトを返す） */
function buildScenario(sc) {
  const d = {
    household: { ...DATA.household },
    people: JSON.parse(JSON.stringify(DATA.people)),
    templates: JSON.parse(JSON.stringify(DATA.templates)),
    contributions: JSON.parse(JSON.stringify(DATA.contributions)),
    expenses: [...DATA.aug.map(MODEL.row), ...DATA.sepOpen.map(MODEL.row)],
    settlements: {},
  };
  /* 8月の精算（§9.7）: 9/1 に確定、まさと入れた、9/2 にりさこ受け取った → 精算済み */
  const as = DATA.augSettle;
  MODEL.confirmMonth(d, '2026-08', as.confirm[0], as.confirm[1]);
  for (const [p, by, at] of as.checks) MODEL.toggleCheck(d, '2026-08', p, by, at);
  let now = SCENARIOS[0].now;
  for (const s of SCENARIOS) {
    if (s.apply) {
      s.apply(d); now = s.now;
      /* sep-open 以外では新着の判定をその時点までに見たことにする（§9.8 の期待値は sep-open だけ） */
      d.people.a.lastSeen = now; d.people.b.lastSeen = now;
    }
    if (s.id === sc) break;
  }
  return { data: d, now: (SCENARIOS.find((s) => s.id === sc) || SCENARIOS[0]).now };
}

  /* V10: EXPECT.cases の合成ケースのうち精算額を持つもの（B・C・C0・D・E）をすべて突き合わせる。ケースを足したらここも自動で増える */
  const v10ids = Object.keys(EXPECT.cases).filter((id) => EXPECT.cases[id].settle);
  const res = v10ids.map((id) => { const c = CASES.find((x) => x.id === id); const r = c && CALC.computeSettle({ a: CALC.contributionOf(c.net.a, 40), b: CALC.contributionOf(c.net.b, 40) }, c.adv, c.adv.a + c.adv.b + c.joint); return [id, r]; });
  ok = res.every(([id, r]) => r && eq(r.settle, EXPECT.cases[id].settle) && r.jointNet === EXPECT.cases[id].jointNet) && CALC.contributionOf(283457, 40) === EXPECT.cases.L.contribA;
  add('V10', `§6.3 の合成ケース ${v10ids.join('・')}・L`, ok, res.map(([id, r]) => `${id}: ${r ? `${r.settle.a}・${r.settle.b} → ${r.jointNet}` : '見つからない'}`).join(' ／ ') + ` ／ L: floor(283,457 × 40 ÷ 100) ＝ ${f(CALC.contributionOf(283457, 40))}`);
  /* V11（§6.2・§6.3 ケースN）: 共用の通帳の動き ＝ Σ手取り(共用に入る人) ＋ Σ正の精算額 − 共用払い − Σ|負の精算額|
     ＝ （Σ出す額 − 支出合計）＋ Σ(手取り − 共用に入った給料)。§9 の見本データ（2人とも自分の口座）でも両辺とも V4 と同じ値になる */
  {
    const P = ['a', 'b'];
    /* 通帳の動きを、式のとおりに1つずつ足して出す（CALC とは別の道すじで出して突き合わせる） */
    const book = (md) => P.reduce((t, p) => t + md.salaryIn[p], 0) + P.reduce((t, p) => t + Math.max(md.settle[p], 0), 0)
      - md.joint - P.reduce((t, p) => t + Math.max(-md.settle[p], 0), 0);
    const cn = CASES.find((c) => c.id === 'N');
    const nb = buildScenario(cn.real.sc); cn.real.mod(nb.data);
    const mn = CALC.settleModel(nb.data, cn.real.m, nb.now);
    const ex = EXPECT.caseN;
    let bad11 = [];
    if (!eq(mn.jointSalary, ex.jointSalary)) bad11.push('ケースN 共用に入った給料');
    if (!eq(mn.settle, ex.settle)) bad11.push('ケースN 精算額');
    if (mn.jointNet !== ex.jointNet || mn.salaryLeft !== ex.salaryLeft || mn.jointBook !== ex.jointBook) bad11.push('ケースN 共用');
    if (book(mn) !== ex.jointBook) bad11.push('ケースN 通帳の動き');
    /* 見本データのまま（2人とも自分の口座）は、通帳の動き ＝ 共用の過不足（V4 と同じ値） */
    for (const [n, md] of sets.map(([n, md]) => [n, md])) if (md.settle && (md.jointBook !== md.jointNet || book(md) !== md.jointNet)) bad11.push(n + ' 見本データ');
    /* 手取り < 出す額（出す額まで届かない）: 共用に入った給料 ＝ 手取り。残り 30,000 は追加で共用へ入れる */
    const e1 = CALC.computeSettle({ a: 80000, b: 88000 }, { a: 0, b: 22070 }, 168070,
      { a: CALC.jointSalaryOf(50000, 80000, true), b: 0 }, { a: CALC.salaryInOf(50000, true), b: 0 });
    if (CALC.jointSalaryOf(50000, 80000, true) !== 50000 || e1.settle.a !== 30000 || e1.salaryLeft !== 0) bad11.push('手取り < 出す額');
    /* 2人とも共用に入る: どちらも立替の実費だけ受け取る（精算額 ＝ −立替） */
    const js2 = { a: CALC.jointSalaryOf(300000, 120000, true), b: CALC.jointSalaryOf(220000, 88000, true) };
    const e2 = CALC.computeSettle({ a: 120000, b: 88000 }, { a: 37510, b: 22070 }, 206130, js2, { a: 300000, b: 220000 });
    if (e2.settle.a !== -37510 || e2.settle.b !== -22070 || e2.jointBook !== 1870 + (300000 - 120000) + (220000 - 88000)) bad11.push('2人とも共用');
    /* 手取りが未入力の月: 共用に入った給料 0（出す額も決まっていない） */
    if (CALC.jointSalaryOf(null, null, true) !== 0) bad11.push('手取り未入力');
    /* 精算中の月は、決めたときに保存した値で表示する（あとで S-33 を変えても動かない） */
    const lb = buildScenario('sep-ready'); cn.real.mod(lb.data);
    MODEL.confirmMonth(lb.data, '2026-09', 'a', '2026-10-01T21:00');
    lb.data.people.b.salaryToJoint = false; lb.data.contributions['2026-09'].b.salaryToJoint = false;
    const ml = CALC.settleModel(lb.data, '2026-09', '2026-10-01T21:05');
    if (ml.jointSalary.b !== 88000 || ml.settle.b !== -22070 || ml.jointBook !== 133870) bad11.push('精算中はスナップショット');
    add('V11', '共用の通帳の動き ＝ Σ手取り(共用に入る人) ＋ Σ正の精算額 − 共用払い − Σ|負の精算額| ＝ 共用の過不足 ＋ 給料の残り', bad11.length === 0,
      bad11.length ? bad11.join('、') : `ケースN: 220,000 ＋ ${f(mn.settle.a)} − ${f(mn.joint)} − ${f(-mn.settle.b)} ＝ ${f(mn.jointBook)}（過不足 ${f(mn.jointNet)} ＋ 給料の残り ${f(mn.salaryLeft)}）`
        + ` ／ 見本データ（2人とも自分の口座）は V4 と同じ ${sets.map(([n, md]) => `${n} ${md.jointBook < 0 ? '−' : ''}${f(Math.abs(md.jointBook))}`).join('・')}`
        + ` ／ 手取り < 出す額・2人とも共用・手取り未入力・精算中はスナップショット`);
  }
  /* 補足: もう払った分の件数（§9.6 S-22 の表）と §9.8 のシナリオ期待値 */
  ok = sets.filter(([, , ex]) => ex.advCount).every(([, md, ex]) => md.sum.advRows.a.length === ex.advCount.a && md.sum.advRows.b.length === ex.advCount.b);
  add('S-22', 'もう払った分の件数（8月 6・6 ／ 見込み 6・5 ／ 確定 8・6 ／ やり直し 9・6）', ok, sets.map(([n, md]) => `${n} ${md.sum.advRows.a.length}・${md.sum.advRows.b.length}`).join(' ／ '));
  const attKey = (a) => a ? [a.kind, a.m].concat(a.amount != null ? [a.amount] : []).join(':') : null;
  const bad = [];
  for (const [sc, ex] of Object.entries(EXPECT.scen)) {
    const b = buildScenario(sc); const d = b.data;
    const m20 = CALC.defaultSettleMonth(d, b.now);
    const st = CALC.s20State(d, CALC.settleModel(d, m20, b.now));
    if (st !== ex.s20) bad.push(`${sc} S-20=${st}`);
    /* 「この月を精算する」を押した月は、月の途中でも estimate を飛ばして prep / ready になる（§4 S-20） */
    if (ex.s20now) { const sn = CALC.s20State(d, CALC.settleModel(d, m20, b.now), m20); if (sn !== ex.s20now) bad.push(`${sc} この月を精算する=${sn}`); }
    if (ex.s20m && m20 !== ex.s20m) bad.push(`${sc} 月=${m20}`);
    if (attKey(CALC.attention(d, 'a', b.now)) !== ex.attA) bad.push(`${sc} まさとの点`);
    if (attKey(CALC.attention(d, 'b', b.now)) !== ex.attB) bad.push(`${sc} りさこの点`);
    if (ex.newA != null) {
      const cnt = (v) => d.expenses.filter((e) => e.month === '2026-09' && e.by !== 'auto' && e.by !== v && e.at > d.people[v].lastSeen).length;
      if (cnt('a') !== ex.newA || cnt('b') !== ex.newB) bad.push(`${sc} 新着`);
    }
    if (ex.octTotal != null) { const so = CALC.summarize(d.expenses, '2026-10'); if (so.total !== ex.octTotal || so.pending.length !== ex.octPending) bad.push(`${sc} 10月`); }
  }
  /* 月の途中で精算した月は、その月が終わるまで赤い点もお知らせ行も出さない（§3.2・§4.0.2）。
     sep-open（9/22）で「この月を精算する」→ 金額待ち2件を片付け → ［この金額で精算］と同じことをする
     （ACT.settleNow は画面の状態だけなのでデータは動かない。ACT.confirm の中身が MODEL.confirmMonth） */
  {
    const b = buildScenario('sep-open'), d = b.data, m = '2026-09';
    for (const e of CALC.settleModel(d, m, b.now).pending) MODEL.fillAmount(d, e.id, 6200, 'a', b.now);
    MODEL.confirmMonth(d, m, 'a', b.now);
    const md = CALC.settleModel(d, m, b.now);
    /* 空振りしていないこと（精算中で、2人とも動かすお金が残っている）も見る */
    if (md.status !== 'confirmed' || md.remaining.a === 0 || md.remaining.b === 0) bad.push('月の途中の精算 前提=' + md.status);
    if (CALC.attention(d, 'a', b.now) || CALC.attention(d, 'b', b.now)) bad.push('月の途中の精算 9/22 に赤い点が出る');
    /* 10/1 になったら今までどおり出る */
    const oct = '2026-10-01T09:00';
    if (!CALC.attention(d, 'a', oct) || !CALC.attention(d, 'b', oct)) bad.push('月の途中の精算 10/1 に赤い点が出ない');
  }
  add('§9.8', 'シナリオごとの期待値（S-20 の状態〈「この月を精算する」を押したときも〉・赤い点・新着・10月）', bad.length === 0, bad.length ? bad.join('、') : '7シナリオ × まさと・りさこ ＋ 月の途中の精算（9/22 は出ない・10/1 に出る）');
  return out;
}
